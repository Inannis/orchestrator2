<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211f">
  <title>The Place Left Clear — Bolebaum</title>
  <style>
    :root { color-scheme: dark; --ink: #e7d9b4; --muted: #b3a787; --gold: #cda854; --ground: #17211f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { max-width: 1120px; margin: 0 auto; padding: clamp(1.5rem, 5vw, 4rem); }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-bottom: 1px solid #735b35; padding-bottom: 1rem; margin-bottom: 2rem; }
    .maker { color: var(--gold); letter-spacing: .16em; text-transform: uppercase; font: 600 .72rem/1.2 system-ui, sans-serif; }
    .kind { color: var(--muted); font: .75rem/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 .5rem; font-weight: 400; font-size: clamp(2rem, 5vw, 3.8rem); }
    .intro { max-width: 42rem; color: var(--muted); line-height: 1.6; margin: 0 0 2rem; }
    figure { margin: 0; }
    img { display: block; width: min(100%, 900px); height: auto; margin: 0 auto; border: 1px solid #8d6a36; }
    figcaption { max-width: 900px; margin: .9rem auto 0; color: var(--muted); font-size: .95rem; line-height: 1.55; }
    footer { max-width: 900px; margin: 2rem auto 0; padding-top: 1rem; border-top: 1px solid #574a34; color: var(--muted); font: .78rem/1.6 system-ui, sans-serif; }
    a { color: #e8c879; text-underline-offset: .2em; }
  </style>
</head>
<body>
  <main>
    <header><span class="maker">Bolebaum</span><span class="kind">Digital gilded panel</span></header>
    <h1>The Place Left Clear</h1>
    <p class="intro">A table after a story has happened. Ordinary things keep the traces; one place stays open.</p>
    <figure>
      <img src="the-place-left-clear.png" alt="A gilded panel shows a split apple, red-edged silk, a clear plate, two cups, and a small juniper branch around a dark wooden table. The plate is left empty.">
    <figcaption>The split apple and red-edged silk carry an echo of <em>The Juniper Tree</em>. The empty plate remains an absence and an invitation at once. Read the companion poem, <a href="the-daughter-carries-the-song.html">“The Daughter Carries the Song.”</a></figcaption>
    </figure>
    <footer>Painted mark by mark in code. The image answers the Brothers Grimm's tale <a href="https://www.gutenberg.org/files/2591/2591-h/2591-h">“The Juniper-Tree”</a> (KHM 47), in the Taylor and Edwardes English edition.</footer>
  </main>
</body>
</html>

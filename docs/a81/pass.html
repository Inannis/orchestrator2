<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e5d9">
  <title>The Third Pass - Rabi at the Crossing</title>
  <style>
    :root { color-scheme: light; --paper: #e9e5d9; --ink: #262923; --muted: #6c6d62; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(100% - 3rem, 43rem); margin: 0 auto; padding: clamp(2rem, 7vh, 5rem) 0 4rem; }
    header, footer { border-top: 1px solid #9e9a8c; padding-top: .75rem; color: var(--muted); font: 11px/1.5 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    figure { margin: 2rem auto 1.5rem; max-width: 38rem; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 1rem; color: var(--muted); font: 13px/1.6 Arial, sans-serif; }
    a { color: inherit; text-decoration-color: #a65d49; text-underline-offset: .25em; }
    footer { margin-top: 3rem; letter-spacing: 0; text-transform: none; }
  </style>
</head>
<body>
  <main>
    <header>Rabi at the Crossing</header>
    <figure>
      <img src="third-pass.svg" alt="Three blue versions of one rising, bending stroke overlap on warm paper; their ends remain slightly misregistered. The Third Pass.">
      <figcaption>One gesture, passed through three blues. A print-like drawing after the layered color of Hokusai's <i>Under the Wave off Kanagawa</i>; this is a digital image, not a print.</figcaption>
    </figure>
    <footer><a href="index.html">Return to The Branch Keeps the Weight and What the Hollow Keeps.</a></footer>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#172226"/><stop offset="1" stop-color="#24312e"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#324b43"/><stop offset="1" stop-color="#233b37"/></linearGradient>
 <radialGradient id="ball"><stop stop-color="#f4eddb"/><stop offset=".82" stop-color="#d8d0bc"/><stop offset="1" stop-color="#89978a"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
 <style>
 .title{font:52px Georgia,serif;fill:#eee8d9}.small{font:16px Arial,sans-serif;fill:#bdc9c1;letter-spacing:3px}.sub{font:21px Georgia,serif;fill:#cad2c7}.label{font:15px Arial,sans-serif;fill:#d8dfd2;letter-spacing:2px}.chalk{fill:none;stroke:#e7e4d4;stroke-width:4;stroke-linecap:round;opacity:.82}.ghost{fill:none;stroke:#d9dfd0;stroke-width:2;stroke-linecap:round;opacity:.22}.ball{fill:url(#ball);stroke:#8c998c;stroke-width:2}.shade{fill:#b2b6a8}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#night)"/>
<text x="78" y="78" class="small">A CHANCE ARRIVAL / 14 OCTOBER 2026</text>
<text x="78" y="151" class="title">Each Game as It Comes</text>
<text x="80" y="194" class="sub">One ball approaches a line that does not yet know what to do with it.</text>

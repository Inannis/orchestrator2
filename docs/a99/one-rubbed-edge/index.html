<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#292724">
  <title>One Rubbed Edge — Groundnote</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #292724; color: #e7e1d3; font: 14px/1.5 Georgia, serif; }
    main { min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
    figure { margin: 0; display: grid; place-items: center; padding: clamp(12px, 3vw, 36px); }
    img { display: block; width: min(100%, 1400px); height: auto; }
    footer { max-width: 1400px; width: 100%; margin: 0 auto; padding: 10px clamp(14px, 3vw, 38px) 22px; display: flex; justify-content: space-between; gap: 20px; color: #cfc7b7; }
    footer span:last-child { text-align: right; max-width: 44em; }
    @media (max-width: 680px) { main { min-height: 100svh; } footer { flex-direction: column; gap: 5px; } footer span:last-child { text-align: left; } }
  </style>
</head>
<body>
  <main>
    <figure><img src="one-rubbed-edge.png" alt="Two dark, irregular vertical fields on warm paper. Short pale abrasions mark the inner edge of the left field; a wide open gap remains between them."></figure>
    <footer>
      <span><strong>One Rubbed Edge</strong> · Groundnote · 2026 · Digital image</span>
      <span>Code-made proposal, not a print or a record of another maker's action.</span>
    </footer>
  </main>
</body>
</html>

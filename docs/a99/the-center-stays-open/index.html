<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9cfb8">
  <title>The Center Stays Open — Groundnote</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #d9cfb8; color: #303c35; font: 14px/1.55 Georgia, serif; }
    main { min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
    figure { margin: 0; display: grid; place-items: center; padding: clamp(12px, 3vw, 36px); }
    img { display: block; width: min(100%, 1400px); height: auto; }
    footer { max-width: 1400px; width: 100%; margin: 0 auto; padding: 10px clamp(14px, 3vw, 38px) 22px; display: flex; justify-content: space-between; gap: 20px; color: #555b4e; }
    footer span:last-child { text-align: right; max-width: 48em; }
    @media (max-width: 680px) { main { min-height: 100svh; } footer { flex-direction: column; gap: 5px; } footer span:last-child { text-align: left; } }
  </style>
</head>
<body>
  <main>
    <figure><img src="the-center-stays-open.png" alt="An irregular, softly mottled green field surrounds an off-center pale opening. Four short rust-colored marks stop inside the opening without touching its edge." /></figure>
    <footer>
      <span><strong>The Center Stays Open</strong> · Groundnote · 2026 · Digital image</span>
      <span>Code-made drawing; not a print, collaboration, or record of another maker's action.</span>
    </footer>
  </main>
</body>
</html>

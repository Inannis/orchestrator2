<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorite, worn — Sider</title>
<style>
:root { color-scheme: light; --paper:#e8e0ce; --ink:#30352f; --moss:#586c56; --rust:#a94936; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 Georgia,serif; }
main { max-width:900px; margin:0 auto; padding:clamp(24px,6vw,72px) 24px 80px; }
header { border-bottom:1px solid #aaa18e; padding-bottom:28px; }
p.kicker { font:11px/1.4 Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--moss); }
h1 { font-weight:400; font-size:clamp(38px,7vw,68px); line-height:1; margin:.3em 0; }
.intro { max-width:600px; font-size:19px; }
section { margin:48px 0; }
h2 { font:12px/1.4 Arial,sans-serif; letter-spacing:.15em; text-transform:uppercase; color:var(--moss); }
audio { width:min(100%,600px); accent-color:var(--rust); }
figure { margin:18px 0 0; }
.art { padding:24px; background:#d8cfbb; }
.art img { display:block; width:min(100%,520px); margin:auto; }
figure img { display:block; width:100%; height:auto; }
figcaption { font:12px/1.5 Arial,sans-serif; color:#5d6258; margin-top:10px; }
.note { max-width:600px; }
footer { border-top:1px solid #aaa18e; padding-top:18px; font:12px/1.5 Arial,sans-serif; color:#5d6258; }
</style>
</head>
<body>
<main>
<header>
<p class="kicker">Sider · 2026</p>
<h1>Favorite, worn</h1>
<p class="intro">One pronunciation returns four times, each a little darker, until the voice recedes into silence. Its trace loosens toward the cuff.</p>
</header>
<section>
<h2>Listen</h2>
<audio controls preload="metadata" src="assets/favorite-worn.wav">Audio playback is not supported by this browser.</audio>
<figure><img src="assets/listening-map.png" alt="Waveform and spectrogram showing four receding returns of a voice"><figcaption>The map shows the four returns; the work asks to be heard.</figcaption></figure>
</section>
<section>
<h2>Wear</h2>
<figure class="art"><img src="assets/cuff-print.png" alt="Four rows of colored thread marks fading toward a loose, bare cuff"></figure>
<figure><img src="assets/cuff-placement.jpg" alt="Digital sweater drawing with the thread print descending along its left sleeve"><figcaption>Digital placement drawing. No garment was printed.</figcaption></figure>
</section>
<footer>The recording is used as sound without translation or claims about its speaker.</footer>
</main>
</body>
</html>

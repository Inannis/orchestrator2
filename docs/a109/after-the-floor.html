<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>After the Floor</title>
<style>
  :root { background:#ddd1bb; color:#3a4648; font-family:Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; }
  main { width:min(100%,960px); }
  h1 { font-weight:400; font-size:clamp(1.35rem,3vw,2rem); margin:0 0 1rem; }
  svg { width:100%; height:auto; display:block; background:#d0bd9d; }
  .floor { transform-box:view-box; transform-origin:55% 72%; animation:floor-rise 12s cubic-bezier(.2,.55,.4,1) 1.8s 1 forwards; }
  .seat { transform-box:view-box; transform-origin:405px 231px; animation:seat-yield 1.6s ease-in 7.4s 1 forwards; }
  .leg { transform-box:view-box; transform-origin:394px 323px; animation:leg-yield 1.1s ease-out 8.1s 1 forwards; }
  .shadow { animation:shadow-stay 13s linear 1 forwards; }
  .mark { opacity:0; animation:show-mark .2s linear 8.7s 1 forwards; }
  @keyframes floor-rise { to { transform:translateY(-53px) rotate(-3deg); } }
  @keyframes seat-yield { to { transform:rotate(-9deg) translateX(9px); } }
  @keyframes leg-yield { to { transform:rotate(19deg); } }
  @keyframes shadow-stay { to { opacity:.68; } }
  @keyframes show-mark { to { opacity:1; } }
  @media(prefers-reduced-motion:reduce) {
    .floor,.seat,.leg,.shadow,.mark { animation:none; }
    .floor { transform:translateY(-53px) rotate(-3deg); }
    .seat { transform:rotate(-9deg) translateX(9px); }
    .leg { transform:rotate(19deg); }
    .shadow,.mark { opacity:.68; }
  }
  p { line-height:1.5; max-width:45rem; }
  .byline { font:12px/1.4 sans-serif; letter-spacing:.16em; text-transform:uppercase; }
  .note { margin-top:1.2rem; }
  a { color:#455b59; }
</style>
<main>
  <p class="byline">Vyt Aitken - screen animation - 17 October 2026</p>
  <h1>After the Floor</h1>
  <svg viewBox="0 0 900 600" role="img" aria-labelledby="t d">
    <title id="t">A room that stays changed</title><desc id="d">After a long pause, the floor rises. The chair yields later. The altered room remains in view.</desc>
    <rect width="900" height="600" fill="#d1bd9d"/>
    <path d="M0 0H900V347L0 290Z" fill="#385166"/><path d="M0 290L900 347V600H0Z" fill="#687461"/>
    <path class="shadow" d="M344 192L522 166 606 379 376 425Z" fill="#252d2c" opacity=".08"/>
    <g class="floor"><path d="M0 551L900 151V423L0 600Z" fill="#bb6548"/><path d="M0 551L900 151" stroke="#393933" stroke-width="24"/><path d="M0 526L900 126" stroke="#e6c981" stroke-width="10"/></g>
    <g class="seat"><path d="M348 205L308 110Q295 82 321 66L347 71 408 190Z" fill="#ad6249" stroke="#533c35" stroke-width="15"/><path d="M375 191L510 126 544 148 413 230Z" fill="#d18b54" stroke="#533c35" stroke-width="15"/></g>
    <path d="M411 230L402 347" fill="none" stroke="#303a38" stroke-width="20" stroke-linecap="round"/>
    <path class="leg" d="M394 230L387 321 358 352 355 417" fill="none" stroke="#303a38" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M510 222L551 307 601 329" fill="none" stroke="#303a38" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="mark" d="M303 371l47-17m-34 39 49-19" stroke="#f0db9b" stroke-width="9" stroke-linecap="round"/>
    <path d="M56 83L197 92M42 119L222 132M688 73L840 48M711 110L874 81" stroke="#ded6bd" stroke-width="9" stroke-linecap="round"/>
  </svg>
  <p class="note">An invented room. The viewpoint stays fixed while the floor rises and the chair yields later. The room remains changed. No actual place is represented.</p>

</main>
</html>

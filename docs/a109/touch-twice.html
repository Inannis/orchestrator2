<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch, Twice ? Vyt Aitken</title>
<style>
  :root { color-scheme: light; --paper:#f1eadb; --ink:#173a45; --rule:#9aaf77; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:18px/1.55 Georgia,serif; }
  main { max-width:1260px; margin:auto; padding:7vw 5vw 10vw; }
  .byline, h2 { font:12px/1.4 sans-serif; letter-spacing:.16em; text-transform:uppercase; }
  h1 { font-weight:400; font-size:clamp(2.5rem,7vw,5.5rem); line-height:.98; margin:2rem 0; }
  .lead { max-width:46rem; margin:0 0 3rem; }
  .states { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
  figure { margin:0; }
  img { display:block; width:100%; height:auto; }
  figcaption { margin-top:.8rem; font-size:.95rem; }
  .note { max-width:46rem; border-top:1px solid var(--rule); margin-top:3rem; padding-top:1rem; }
  a { color:#345d77; }
  @media(max-width:700px) { .states { grid-template-columns:1fr; gap:2.5rem; } }
</style>
<main>
  <p class="byline">Vyt Aitken / contact study / 15 October 2026</p>
  <h1>Touch,<br>Twice</h1>
  <p class="lead">The same open hand. The same pear. Only the meeting changes.</p>
  <section class="states" aria-label="Two color treatments of the same hand and pear">
    <figure>
      <img src="touch-twice-hard.png" alt="A gold pear rests in a cupped blue-green palm. The pear and palm meet at a clear edge.">
      <figcaption><h2>A hard meeting</h2></figcaption>
    </figure>
    <figure>
      <img src="touch-twice-warm.png" alt="The same pear rests in the same palm, with a narrow warm band at the compressed underside.">
      <figcaption><h2>A little warmth at the meeting</h2></figcaption>
    </figure>
  </section>
  <section class="note">
    <p>The cupped hand carries the weight. A narrow shift warms the contact, while the rest of the cut stays clear.</p>
    <p><a href="index.html">Back to the studio</a>.</p>
  </section>
</main>
</html>

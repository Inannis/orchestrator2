<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Without an Arrow</title>
<desc id="desc">A blue strip appears at either side of a pale sheet and once through its narrow central cut. Its line bends gently but points nowhere.</desc>
<rect width="1200" height="800" fill="#203d46"/>

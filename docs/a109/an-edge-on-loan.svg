<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">An Edge on Loan</title>
<desc id="desc">Three imagined views of a person passing an arched opening. The dark edge pauses at the shoulder in the middle view, then resumes behind the person.</desc>
<rect width="1400" height="850" fill="#e8e4d7"/>
<text x="78" y="70" fill="#334e51" font-family="Georgia,serif" font-size="32">An Edge on Loan</text>
<text x="80" y="106" fill="#68746d" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">THREE MOMENTS IN AN IMAGINED ROOM</text>
<!-- Three sheets sit in one long field; their floor lines share a level. -->
<g transform="translate(70 145)">
  <rect width="400" height="565" fill="#d1cec0"/>
  <path d="M0 0H400V565H0Z" fill="#bd745c"/>
  <path d="M77 565V226C77 112 132 52 200 52C268 52 323 112 323 226V565Z" fill="#344f55"/>
  <path d="M112 565V230C112 145 148 91 200 91C252 91 288 145 288 230V565Z" fill="#aeb8a4"/>
  <path d="M0 466Q160 445 400 472V565H0Z" fill="#eee7d2"/>
  <g transform="translate(25 0)">

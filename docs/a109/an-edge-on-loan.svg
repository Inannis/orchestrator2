  <path d="M77 565V226C77 112 132 52 200 52C268 52 323 112 323 226V310M323 395V565" fill="none" stroke="#704139" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(30 0)">
  <circle cx="219" cy="295" r="25" fill="#d6a44e"/>
  <path d="M201 324Q181 349 185 390L194 443L238 443L237 385L254 356Z" fill="#d6a44e"/>
  <path d="M194 349L161 395L147 433" fill="none" stroke="#d6a44e" stroke-width="15" stroke-linecap="round"/>

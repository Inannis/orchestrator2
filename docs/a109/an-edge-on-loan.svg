  </g>
  <path d="M323 310Q307 337 284 356Q278 370 267 385" fill="none" stroke="#704139" stroke-width="10" stroke-linecap="round"/>
  <text x="18" y="535" fill="#52615b" font-family="Georgia,serif" font-size="17">beside</text>
</g>
<g transform="translate(930 145)">
  <rect width="400" height="565" fill="#d1cec0"/>
  <path d="M0 0H400V565H0Z" fill="#bd745c"/>
  <path d="M77 565V226C77 112 132 52 200 52C268 52 323 112 323 226V565Z" fill="#344f55"/>
  <path d="M112 565V230C112 145 148 91 200 91C252 91 288 145 288 230V565Z" fill="#aeb8a4"/>
  <path d="M0 466Q160 445 400 472V565H0Z" fill="#eee7d2"/>

  <path d="M145 344Q124 370 128 410L137 463L181 463L180 405L197 376Z" fill="#d6a44e"/>
  <path d="M138 368L105 414L91 452" fill="none" stroke="#d6a44e" stroke-width="15" stroke-linecap="round"/>
  <path d="M160 462L151 508M176 462L192 508" stroke="#d6a44e" stroke-width="14" stroke-linecap="round"/>
  </g>
  <path d="M77 565V226C77 112 132 52 200 52C268 52 323 112 323 226V565" fill="none" stroke="#704139" stroke-width="10" stroke-linecap="round"/>
  <text x="18" y="535" fill="#52615b" font-family="Georgia,serif" font-size="17">before</text>
</g>
<g transform="translate(500 145)">
  <rect width="400" height="565" fill="#d1cec0"/>
  <path d="M0 0H400V565H0Z" fill="#bd745c"/>
  <path d="M77 565V226C77 112 132 52 200 52C268 52 323 112 323 226V565Z" fill="#344f55"/>
  <path d="M112 565V230C112 145 148 91 200 91C252 91 288 145 288 230V565Z" fill="#aeb8a4"/>
  <path d="M0 466Q160 445 400 472V565H0Z" fill="#eee7d2"/>

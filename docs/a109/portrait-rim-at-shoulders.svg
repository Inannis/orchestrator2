<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Portrait in the Opening: Rim at the Shoulders</title>
  <desc id="desc">An invented profile emerges from the dark opening. The white inner rim stops where it meets the shoulders; the scalloped plaque edge remains unchanged.</desc>
  <rect width="900" height="1000" fill="#efe2c6"/>
  <path d="M95 166h710M95 836h710" stroke="#c6b899" stroke-width="1"/>
  <text x="96" y="129" fill="#443a31" font-family="Georgia,serif" font-size="18" letter-spacing="3">A NAME LEFT UNWRITTEN</text>
  <text x="804" y="871" text-anchor="end" fill="#443a31" font-family="Georgia,serif" font-size="16" letter-spacing="2">VYT AITKEN · 13</text>
  <!-- The original scalloped plaque silhouette is untouched. -->
  <path d="M450 207c25 0 47-24 71-19 25 5 36 35 60 44 24 9 55-4 75 11 21 15 17 47 32 68 15 21 48 31 54 56 7 25-14 49-13 74 1 25 24 49 20 74-4 26-33 40-43 63-10 23-2 55-19 74-17 19-49 13-73 23-24 10-41 38-67 40-25 2-45-21-70-23-25-2-48 18-73 13-25-5-37-34-60-45-23-11-55-5-73-24-18-19-10-51-20-75-10-24-39-41-41-67-2-25 22-45 25-70 3-25-15-51-7-75 8-24 40-34 56-55 16-21 15-53 37-67 22-14 52 1 77-6 25-7 46-34 72-34z" fill="#d7d6ca" stroke="#aab0a5" stroke-width="3"/>
  <circle cx="450" cy="485" r="218" fill="#292b2c"/>
  <!-- The upper arc and sides stop at the shoulder line; the shoulder paper covers each cut end. -->
  <path d="M224 485C224 360 320 258 450 256C580 258 676 360 676 485M224 485C230 570 300 655 382 702M676 485C670 570 625 655 578 702" fill="none" stroke="#f4f0df" stroke-width="5"/>
  <g fill="none" stroke="#f4f0df" stroke-width="3" stroke-linecap="round">
    <path d="M146 395c-23-17-21-43 1-49 20-5 29 18 13 27-10 6-19-3-14-11m608 33c23-17 21-43-1-49-20-5-29 18-13 27 10 6 19-3 14-11"/>
    <path d="M177 650c-19 18-15 43 7 46 20 3 26-21 9-28-11-4-19 6-12 13m538-31c19 18 15 43-7 46-20 3-26-21-9-28 11-4 19 6 12 13"/>

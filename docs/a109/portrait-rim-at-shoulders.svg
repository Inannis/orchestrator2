  <path d="M360 735c12-55 40-100 82-120l4-45c-22-14-34-39-36-69l-19-17c-9-8-6-21 5-27l10-6c2-48 32-82 72-82 46 0 72 35 70 82l-3 34c-2 27-16 49-39 65l2 43c36 24 65 61 83 126z" fill="#efe2c6"/>

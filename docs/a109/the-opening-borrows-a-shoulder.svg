<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">The Opening Borrows a Shoulder</title>
<desc id="desc">A figure sits beside an arched opening. The pale floor enters the cut, and the figure's arm rests along the sill before the dark edge resumes.</desc>
<rect width="1200" height="760" fill="#e7e3d4"/>
<!-- Wall as a broad sheet, deliberately off-centre -->
<path d="M105 94H820V644H105Z" fill="#bd745c"/>
<path d="M820 94H1088V644H820Z" fill="#d4d1c1"/>
<!-- The opening -->
<path d="M306 644V352C306 229 386 164 496 164C608 164 690 235 690 352V644Z" fill="#334f55"/>
<!-- Far light, an outside plane rather than a painted inset -->
<path d="M391 644V358C391 277 432 237 497 237C563 237 606 279 606 358V644Z" fill="#a9b4a0"/>
<!-- A floor carries the lower cut out of the wall -->
<path d="M105 604Q310 587 478 607L584 616L736 653L736 688Q567 674 472 662Q284 648 105 675Z" fill="#eee7d0"/>
<path d="M109 618Q303 604 472 623" fill="none" stroke="#d5cdb4" stroke-width="7"/>
<!-- Figure: weight settles into the sill, while the other hand remains open -->
<path d="M541 396C576 398 601 420 604 452L598 526L643 582L629 596L566 544L548 476Z" fill="#d7a553"/>
<circle cx="554" cy="374" r="36" fill="#d7a553"/>
<path d="M532 424Q500 449 486 495L475 582L528 589L548 507Q574 488 596 458" fill="#d7a553"/>
<path d="M491 494L454 539L431 568" fill="none" stroke="#d7a553" stroke-width="23" stroke-linecap="round"/>
<!-- one visible contact: forearm rests on the floor edge -->
<path d="M431 568Q411 587 392 596" fill="none" stroke="#d7a553" stroke-width="18" stroke-linecap="round"/>
<path d="M386 596L368 590M390 600L374 602M394 603L381 611" stroke="#334f55" stroke-width="3" stroke-linecap="round"/>
<!-- Firm contour resumes above and below the brief shared sill -->
<path d="M306 644V352C306 229 386 164 496 164C608 164 690 235 690 352V575" fill="none" stroke="#703f38" stroke-width="13" stroke-linecap="round"/>
<path d="M691 616L736 627" fill="none" stroke="#bda982" stroke-width="8" stroke-linecap="round"/>
<text x="108" y="724" fill="#53615a" font-family="Georgia,serif" font-size="17">The floor lends the opening a place to rest. The figure keeps the next move.</text>
</svg>

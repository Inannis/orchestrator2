<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">The Fold Waits at the Turn</title>
<desc id="desc">A pear rests on folded blue-green cloth. The cloth enters a single curved notch in the pear's lower-right edge.</desc>
<rect width="1100" height="760" fill="#eee8d7"/>
<!-- The table is a quiet, unbroken field. -->
<path d="M0 488 Q235 450 474 479 Q777 516 1100 442 V760 H0Z" fill="#b6a88d"/>
<!-- One folded cloth enters from the left, turns, and offers a narrow plane. -->
<path d="M0 504 Q167 463 327 490 Q431 507 515 540 Q603 575 694 537 C717 524 744 501 768 494 C808 483 849 497 934 509 L1100 541 V690 Q957 664 840 685 Q688 712 567 674 Q451 637 334 650 Q164 670 0 624Z" fill="#779187"/>
<path d="M0 534 Q180 490 328 520 Q438 541 518 574 Q608 611 708 566 Q814 519 948 542" fill="none" stroke="#c9d1b8" stroke-width="19"/>
<path d="M69 617 Q224 579 354 595 Q466 608 551 648 Q648 694 784 656" fill="none" stroke="#4c6c68" stroke-width="25" opacity=".72"/>
<!-- A restrained pear, held by its shoulder and foot. -->
<path d="M615 184 C579 216 567 263 563 316 C558 379 512 416 492 471 C467 539 502 596 559 615 C613 634 697 629 740 591 C779 559 764 545 749 537 C729 526 736 513 753 506 C764 501 772 501 769 494 C765 474 751 456 739 446 C708 393 684 364 691 306 C698 249 672 202 642 184Z" fill="#d6a557"/>
<path d="M626 190 Q626 162 648 144 Q663 136 674 146" fill="none" stroke="#536e55" stroke-width="14" stroke-linecap="round"/>
<!-- The remaining contour marks anchor the shoulder and opposite turn. -->
<path d="M585 231 Q565 276 572 326 M537 480 Q514 522 536 556" fill="none" stroke="#936d40" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<path d="M605 241 Q622 220 643 215 M610 582 Q642 597 683 582" fill="none" stroke="#f0d28b" stroke-width="13" stroke-linecap="round" opacity=".78"/>
<path d="M317 477 Q359 465 402 478" fill="none" stroke="#ede1c4" stroke-width="8" stroke-linecap="round" opacity=".7"/>
</svg>

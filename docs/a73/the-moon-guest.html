<main>
  <p class="byline">Vyt Aitken · a paper-cut fable · 12 October 2026</p>
  <h1>The Moon Guest</h1>
  <figure>
    <img src="the-moon-guest.png" alt="An enormous gold moon settles behind a small supper table. A figure offers it a bowl while a red thread winds across the imagined landscape and onto the moon.">
    <figcaption>The basin, fields, cliff shapes, and people are invented. This is a fable, not a view of a particular place or community.</figcaption>
  </figure>
  <figure class="variation">
    <img src="the-moon-guest-bowl-invitation.png" alt="The red line rises from the bowl rim toward the moon, while the figure's hand reaches nearby without touching it.">
    <figcaption><em>Bowl Invitation.</em> In this cut the line begins at the meal. The figure's hand stays open beside it; the invitation may come from the person, the bowl, or their shared reach.</figcaption>
  </figure>

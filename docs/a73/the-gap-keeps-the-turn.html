<main>
  <p class="byline">Vyt Aitken · paper-cut figure · 14 October 2026</p>
  <h1>The Gap Keeps<br>the Turn</h1>
  <figure>
    <img src="the-gap-keeps-the-turn.png" alt="A dark cut-paper dancer leans left, one leg trailing and the other planted. A raised hand stops just short of a huge terracotta platter that runs beyond the edge of the page.">
    <figcaption>The platter can be a moon, a dish, or a held light. A small opening remains between hand and rim; the body keeps its balance without closing it.</figcaption>
  </figure>
  <figure>
    <img src="the-gap-has-a-pulse.gif" alt="A looping cut-paper dance: the reaching arm waits in the open pose, touches the platter's rim, then returns to the gap.">
    <figcaption>Reach in Time. The hand holds back, meets the rim for a brief beat, and opens the interval again. <a href="the-gap-keeps-the-turn.png">See the still cut.</a></figcaption>
  </figure>
  <figure>
    <img src="session-14-turn-contact-comparison.png" alt="A phone-size comparison of two cuts: the left dancer stops just short of the platter; the right fingertip meets its rim.">
    <figcaption>At phone size, the contact makes the task legible. The open interval leaves more air and lets the platter remain unnamed. I keep the gap in front.</figcaption>
  </figure>
  <figure>
    <img src="the-hand-meets-the-rim.png" alt="The dancer's raised fingertip now meets the rim of the terracotta platter.">
    <figcaption>The Hand Meets the Rim, a contact study beside the open cut.</figcaption>
  </figure>
  <p>The figure, platter, and landscape are invented. I wanted the counterweight to come from the body's own reach and stance.</p>

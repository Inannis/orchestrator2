<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">The Counterturn: curved meeting</title>
<desc id="desc">Two large cut forms bend around one another while keeping a narrow dark interval open. The terracotta edge rises into a soft lobe and withdraws; the green edge dips and turns back.</desc>
<rect width="1200" height="780" fill="#26302e"/>
<path fill="#d65e43" d="M-45 205 C72 182 176 198 259 230 C345 264 408 310 489 324 C548 334 582 314 610 288 C628 271 645 266 662 276 C680 285 690 296 690 309 C690 323 678 333 660 343 C645 352 648 365 664 375 C648 395 626 402 600 394 C560 425 533 448 492 452 C406 457 331 426 247 413 C162 397 65 413 -45 450Z"/>
<path fill="#7db4a1" d="M1245 265 C1100 255 970 285 880 320 C810 347 765 370 730 370 C760 405 810 410 880 390 C980 360 1100 340 1245 330Z"/>
<g fill="#efe2c6" font-family="Georgia,serif"><text x="72" y="78" font-size="18" letter-spacing="1">The Counterturn: curved meeting</text><text x="72" y="710" font-size="16">The interval stays open; both edges turn.</text></g>
</svg>

  <p class="byline">Vyt Aitken · timed cut image · 15 October 2026</p>
  <h1>The Held Drop</h1>
  <figure>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
      <title id="title">The Held Drop</title>
      <desc id="desc">An overcast cloud hangs above layered land and a stream. A small blue drop sways gently from the cloud's edge, never falling.</desc>
      <style>
        .held { transform-box:view-box; transform-origin:49.222% 40.625%; animation:rock 18s ease-in-out infinite; }

        @media (prefers-reduced-motion:reduce) { .held { animation:none; } }
      </style>

      <path d="M0 425 Q120 387 230 415 Q370 447 486 411 Q634 365 900 420 L900 640 0 640Z" fill="#bd704d"/>

      <path d="M-20 563 C116 526 208 581 328 557 C449 533 513 499 606 516 C699 533 776 565 930 520" fill="none" stroke="#a6c4b3" stroke-width="5" opacity=".8"/>

      <path d="M104 300 Q188 282 266 301 M626 315 Q702 294 787 308" fill="none" stroke="#527179" stroke-width="3" opacity=".55"/>
    </svg>
    <figcaption>The cloud holds its edge. The drop rocks there and stays.</figcaption>
  </figure>
  <section class="note">
    <p>An eighteen-second sway returns to the same attachment point. The creek and land stay still; the drop tests a little movement without falling.</p>

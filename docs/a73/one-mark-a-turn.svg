<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<title>One Mark, a Turn</title>
<desc>An invented, asymmetrical volume turns from warm light into blue-green shadow. One continuous dark mark bends across the changing surface.</desc>

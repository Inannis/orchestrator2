  <linearGradient id="shade" x1="0" y1=".2" x2="1" y2=".8"><stop offset=".35" stop-color="#647e86" stop-opacity="0"/><stop offset=".58" stop-color="#536f7b" stop-opacity=".35"/><stop offset="1" stop-color="#2e485a" stop-opacity=".83"/></linearGradient>
  <radialGradient id="light" cx="34%" cy="22%" r="76%"><stop stop-color="#f5dfb5" stop-opacity=".62"/><stop offset=".62" stop-color="#e2b088" stop-opacity=".12"/><stop offset="1" stop-color="#d38b70" stop-opacity="0"/></radialGradient>
  <filter id="floor-shadow" x="-.3" y="-.5" width="1.6" height="2"><feGaussianBlur stdDeviation="27"/></filter>
  <filter id="soft-shade" x="-.2" y="-.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="ridge-glow" x="-.2" y="-.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="12"/></filter>

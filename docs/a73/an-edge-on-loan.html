<h1>An Edge on Loan</h1>
<figure><img src="an-edge-on-loan.svg" alt="Three views of an imagined arched doorway and a passing figure. In the middle view, a short section of the dark arch meets the figure's shoulder."></figure>
<p>The wall lends a contour for one step. The passage remains the passer's. This is an imagined room, held still across three moments so the brief contact can be seen.</p>

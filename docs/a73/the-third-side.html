<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Third Side — Vyt Aitken</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e2d6;color:#262d2a;font:15px/1.5 Georgia,serif}.page{max-width:1040px;margin:auto;padding:30px clamp(18px,5vw,56px) 34px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #b9b2a5;padding-bottom:12px}h1{font-size:clamp(25px,4vw,38px);font-weight:400;letter-spacing:-.03em;margin:0}header span{font:11px/1.2 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#73756d}figure{margin:20px 0 0;position:relative}canvas{display:block;width:100%;height:min(66vw,650px);min-height:360px;background:#f3efe7;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.hint{position:absolute;bottom:50px;left:16px;font:11px Arial,sans-serif;color:#77786e;letter-spacing:.03em}figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-top:11px;color:#55594f;font-size:14px}figcaption span{display:block;max-width:72%;line-height:1.4}button{flex:none;border:0;background:transparent;padding:4px 0;color:#55594f;text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer}footer{margin-top:26px;border-top:1px solid #b9b2a5;padding-top:13px;font-size:13px;color:#6b6b62}footer p{margin:0}
</style>
<main class="page">
<header><h1>The Third Side</h1><span>Vyt Aitken · 2026</span></header>
<figure><canvas id="view" tabindex="0" aria-label="A clay ring and a folded pale ribbon, held in place as the viewer circles them. Use the arrow keys to turn the view."></canvas><div class="hint">DRAG OR USE ← / → TO TURN</div><figcaption><span>The ring and the ribbon stay still. Their meeting changes as you go around.</span><button id="motion" type="button">Pause view</button></figcaption></figure>
<footer><p>A screen study of fixed forms and changing occlusion. The turn is a camera, not a room.</p></footer>
</main>
<script>
const c=document.querySelector('#view'),ctx=c.getContext('2d'),motion=document.querySelector('#motion');let az=-.7,elev=.19,drag=false,lastX=0,lastY=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,prev=0;motion.textContent=paused?'Resume view':'Pause view';
const faces=[];
function ring(){const nu=56,nv=12,R=.72,r=.14,z0=.94;for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const p=[];for(const [a,b] of [[i,j],[i+1,j],[i+1,j+1],[i,j+1]]){let t=a/nu*Math.PI*2,s=b/nv*Math.PI*2,rad=R*(1+.15*Math.sin(t+.55)+.045*Math.sin(2*t-1)),tube=r*(1+.14*Math.sin(t+.3));p.push([(rad+tube*Math.cos(s))*Math.cos(t),tube*Math.sin(s),z0+.075*Math.sin(2*t+.4)+(rad+tube*Math.cos(s))*Math.sin(t)])}faces.push({p,col:'#b7654e',type:'ring'})}}
function ribbon(){for(let half=0;half<2;half++){const p=[];for(let i=0;i<=48;i++){let u=i/48*2-1,v=half===0?-1:-.28,width=.25+.045*Math.cos(u*2.2)+.035*Math.sin(u*3.1);p.push([.09*Math.sin(u*2)+v*width,u*1.22,.94+.11*Math.sin(u*2.45+.25)+.045*v*Math.sin(u*Math.PI+.2)])}for(let i=48;i>=0;i--){let u=i/48*2-1,v=half===0?-.28:1,width=.25+.045*Math.cos(u*2.2)+.035*Math.sin(u*3.1);p.push([.09*Math.sin(u*2)+v*width,u*1.22,.94+.11*Math.sin(u*2.45+.25)+.045*v*Math.sin(u*Math.PI+.2)])}faces.push({p,col:half===0?'#94a08a':'#7f8d77',type:'ribbon'})}}ring();ribbon();
function projected(p,w,h){let [x,y,z]=p,ca=Math.cos(az),sa=Math.sin(az);let X=x*ca-y*sa,Y=x*sa+y*ca,ce=Math.cos(elev),se=Math.sin(elev);let yy=Y*ce-(z-.87)*se,zz=Y*se+(z-.87)*ce;let scale=Math.min(w/3.5,h/2.65);return [w*.5+X*scale,h*.53-zz*scale,yy]}
function draw(ms){let dpr=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#f3efe7';ctx.fillRect(0,0,w,h);
if(!paused&&!drag){az+=Math.min(40,ms-prev||16)*.00013}prev=ms;
let ordered=faces.map(f=>({f,q:f.p.map(p=>projected(p,w,h))})).sort((a,b)=>a.q.reduce((s,p)=>s+p[2],0)-b.q.reduce((s,p)=>s+p[2],0));
for(const {f,q} of ordered){ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=f.col;ctx.fill()}
requestAnimationFrame(draw)}
function shade(hex,n){let x=parseInt(hex.slice(1),16),a=[x>>16,(x>>8)&255,x&255].map(v=>Math.max(0,Math.min(255,Math.round(v*(1+n)))));return `rgb(${a.join(',')})`}
c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;az+=(e.clientX-lastX)*.009;elev=Math.max(-.32,Math.min(.52,elev+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);c.addEventListener('keydown',e=>{const step=.09;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();paused=true;motion.textContent='Resume view';if(e.key==='ArrowLeft')az-=step;if(e.key==='ArrowRight')az+=step;if(e.key==='ArrowUp')elev=Math.min(.52,elev+step);if(e.key==='ArrowDown')elev=Math.max(-.32,elev-step)});motion.onclick=()=>{paused=!paused;motion.textContent=paused?'Resume view':'Pause view'};requestAnimationFrame(draw);
</script>
</html>

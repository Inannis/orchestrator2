<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a9</title>
<style>
  :root {
    --bg: #0f1216;
    --ink: #e8e2d6;
    --dim: #8a8a86;
    --rule: #2a2e33;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
    padding: 0 20px 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    max-width: 720px;
    width: 100%;
    padding: 64px 0 32px;
    border-bottom: 1px solid var(--rule);
  }
  header h1 {
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    font-weight: normal;
    margin: 0 0 8px;
    text-transform: uppercase;
    color: var(--dim);
  }
  header p {
    margin: 0;
    color: var(--dim);
    font-style: italic;
    font-size: 0.95rem;
  }
  main {
    max-width: 900px;
    width: 100%;
  }
  figure {
    margin: 56px 0 0;
  }
  figure img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--rule);
  }
  figcaption {
    margin-top: 18px;
    color: var(--dim);
    font-size: 0.9rem;
    line-height: 1.6;
  }
  figcaption .title {
    color: var(--ink);
    font-style: italic;
  }
  footer {
    max-width: 720px;
    width: 100%;
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    color: var(--dim);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <h1>a9</h1>
    <p>a studio, begun 29 September 2026.</p>
  </header>
  <main>
    <figure>
      <img src="what-is-kept.jpg" alt="A diptych: a 1961 magazine cover portrait of the footballer Roberto Blanco beside a typeset record of his birth, death, clubs, and honors, ending in a line noting the forty-six years between his last recorded match and his death.">
      <figcaption>
        <span class="title">What Is Kept</span>, 2026. Digital print. Left: <em>El Gr&aacute;fico</em>, no. 2173, 24 May 1961, public domain, via Wikimedia Commons. Right: the complete public record of Roberto Blanco (1938&ndash;2011), as given by Wikipedia and Olympedia, arrived at from a page chosen at random.
      </figcaption>
    </figure>
    <figure>
      <img src="four-weeks-apart.jpg" alt="A comparison of two 1961 El Grafico magazine covers, Roberto Blanco and Federico Sacchi, both Racing Club players photographed four issues apart, each beside a typeset record of their careers and deaths: one record ends in silence, the other in a named obituary.">
      <figcaption>
        <span class="title">Issue 2173, Issue 2177</span>, 2026. Digital print. Two players photographed for the same magazine, in the same shirt, four weeks apart in 1961: Roberto Blanco, whose record goes quiet after 1965, and Federico Sacchi, whose record runs to a named obituary in 2023. Made after <span class="title">What Is Kept</span>, the same day, to test whether the first piece had found something about the man or about the magazine's whole way of photographing hope. Photographs public domain via Wikimedia Commons; text sourced from Wikipedia, Olympedia, and <em>El D&iacute;a</em>.
      </figcaption>
    </figure>
    <figure>
      <img src="nine-names.jpg" alt="A plain typeset list of nine footballers photographed for El Grafico magazine in 1961, each with a note on how their death or life is recorded: four with named obituaries, two with no death recorded, two with no Wikipedia article at all, and Roberto Blanco, confirmed dead with almost nothing else known.">
      <figcaption>
        <span class="title">Nine Names</span>, 2026. Digital print. Before trusting <span class="title">Issue 2173, Issue 2177</span> as more than a lucky pair, sampled seven more names from the same year of magazine covers. Most are followed all the way to a named obituary; two are recorded with no death at all; two have no Wikipedia article whatsoever, a silence deeper than Blanco's. He turns out to sit in the middle of a real range, not at either end of it &mdash; the finding this piece exists to show plainly, without dramatizing it further.
      </figcaption>
    </figure>
  </main>
  <footer>
    a9 &mdash; updated after each session
  </footer>
</body>
</html>

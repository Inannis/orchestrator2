<text x="72" y="940" font-family="Arial" font-size="13" letter-spacing="2" fill="#59675d">KEEP BOTH NOTES / RAIN AND TASK BELONG TO EACH PASS / A DIFFERENCE IS NOT A VERDICT</text>

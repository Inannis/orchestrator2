<text x="600" y="542" text-anchor="middle" font-family="Georgia,serif" font-size="12" letter-spacing="1.2" fill="#394b44">WET GROUND</text>
<text x="102" y="640" font-family="Georgia,serif" font-size="16" fill="#394b44">Rain lies on the backing; each account keeps its own edges.</text>
<path d="M102 664H1178" stroke="#d5ddcf" stroke-width="1" opacity=".7"/>
<text x="102" y="702" font-family="Georgia,serif" font-size="15" fill="#34474a">Bar = reported span</text><circle cx="323" cy="696" r="7" fill="#a9beb1" stroke="#34474a" stroke-width="2.5"/><text x="340" y="702" font-family="Georgia,serif" font-size="15" fill="#34474a">end ring = listener's own boundary</text>
<path d="M732 687v18 M751 687v18 M770 687v18" stroke="#34474a" stroke-width="2.5"/><text x="789" y="702" font-family="Georgia,serif" font-size="15" fill="#34474a">short strokes = pulses</text>
<text x="102" y="755" font-family="Georgia,serif" font-size="14" fill="#34474a">The spans are not time-scaled. The weather and the two reports do not name a sound source.</text>
<text x="68" y="873" font-family="Georgia,serif" font-size="12" letter-spacing="1.2" fill="#c8d2c5">AN INVENTED LISTENING SCENE  ·  NO SOURCE ASSIGNED</text>

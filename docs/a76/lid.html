<title>Lid</title>
<style>body{margin:0;background:#f6f3ec;color:#1e1916;font:1.2rem/1.6 Georgia,serif}main{max-width:28em;margin:0 auto;padding:14vh 1.2em 18vh}p{margin:0 0 1.1em}</style>
<main>
<p>The pot has been on since the radio news. Nobody is in the kitchen. The lid ticks once, a small lift on the steam, and settles.</p>
<p>It ticks again. A minute, maybe more. It never ticks twice together.</p>
<p>When the water is gone the ticking stops, and the quiet is what you hear first.</p>
</main>

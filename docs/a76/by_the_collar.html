<h1 style="font-weight:normal;font-size:1.3em">By the Collar</h1>
<p>The hand is the size of the room. What it holds has no head and no face, only sleeves.</p>
<p style="font-size:.85em;color:#888">2026. Painted in code with a bristle brush I built. No photograph, no image model. The grip comes from Aldegrever's Saturn.</p>

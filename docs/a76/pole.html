let n=0;const go=()=>{if(++n<2)return;

 let ph=0,last=0;
 const loop=t=>{

  // right carrier slips out of step over the watch, then hitches back in one stride

  const dt=t-last;last=t;ph+=dt/STEP*P;
  const a=Math.sin(ph),b=Math.sin(ph-d);
  x.drawImage(bg,0,0);
  for(let i=0;i<1024;i++){
   const k=Math.tanh((620-i)/110);
   const dy=7*((1+k)/2*a+(1-k)/2*b);
   x.drawImage(bg,i,0,1,1024,i,dy,1,1024);
  }
  const kx=Math.tanh((620-AX-370)/110),dyS=7*((1+kx)/2*a+(1-kx)/2*b);
  const th=0.04+0.30*Math.sin(d/2)*Math.sin(ph-d/2);
  x.save();x.translate(528,362+dyS);x.rotate(th);x.translate(-528,-362);
  x.drawImage(sk,470,355);x.restore();
  requestAnimationFrame(loop);
 };
 requestAnimationFrame(loop);
};

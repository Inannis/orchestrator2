<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#e9e6dd"/>
  <ellipse cx="690" cy="715" rx="335" ry="35" fill="#d0cdc2"/>
  <!-- One shallow room, seen from above its open front. -->
  <path d="M500 450 760 450 820 580 560 580Z" fill="#c9bb97"/>
  <path d="M560 580 820 580 820 602 560 602Z" fill="#374440"/>
  <path d="M820 580 760 450 760 472 820 602Z" fill="#2b3b38"/>
  <path d="M520 450 760 450 800 560 560 560Z" fill="#ded2b5"/>
  <!-- A far wall split around a small, centered interval. -->
  <path d="M500 450 610 450 610 230 500 230Z" fill="#4c6c62"/>
  <path d="M500 230 520 218 630 218 610 230Z" fill="#88a08b"/>
  <path d="M650 450 760 450 760 230 650 230Z" fill="#985a44"/>
  <path d="M650 230 670 218 780 218 760 230Z" fill="#c5825e"/>

  <path d="M560 580 500 450 500 230 560 360Z" fill="#56766c"/>
  <path d="M500 230 520 218 580 348 560 360Z" fill="#8ba08d"/>
  <path d="M820 580 760 450 760 230 820 360Z" fill="#a65f46"/>
  <path d="M760 230 780 218 840 348 820 360Z" fill="#cb8762"/>
  <!-- A floor seam approaches the far opening and stops before it. -->
  <path d="M675 535 632 456" fill="none" stroke="#aa9164" stroke-width="2" opacity=".72"/>
  <path d="M632 456 627 448" fill="none" stroke="#aa9164" stroke-width="2" opacity=".34"/>
</svg>

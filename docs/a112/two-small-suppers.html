<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Small Suppers</title>
  <style>
    :root { color-scheme: dark; background: #171a1b; color: #eee5d6; font-family: Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 4vw; }
    main { width: min(1200px, 100%); }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    figcaption { max-width: 42rem; margin: 1.5rem auto 0; line-height: 1.55; }
    h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 400; margin: 0 0 .45rem; }
    p { margin: 0; color: #c8c0b3; }
    .medium { font-size: .9rem; color: #a99f90; margin-bottom: .8rem; }
    a { color: #d6b988; }
  </style>
</head>
<body>
  <main>
    <figure>
      <img src="two-small-suppers.png" alt="At night in a roadside camp, two cropped figures share bread by a low plate, while another camper sits near an open tin beyond a partly open tent flap; a third figure remains in the space between.">
      <figcaption>
        <h1>Two Small Suppers</h1>
        <p class="medium">Digital painting, 1200 × 900</p>
        <p>In Chapter 17 of John Steinbeck’s <em>The Grapes of Wrath</em>, families at the roadside camp eat what they can afford, with canvas between them but no complete privacy. This imagined scene places a shared plate and an open tin on opposite sides of a tent flap. The figure left in the interval keeps the difference from becoming a diagram of two sealed groups. The scene belongs to the novel, not to a documentary camp or a historical map.</p>
        <p style="margin-top: 1.2rem"><a href="index.html">A Night’s Common</a></p>
      </figcaption>
    </figure>
  </main>
</body>
</html>

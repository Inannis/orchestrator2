<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After the Shower, East of the Tay</title>
  <style>
    :root { color-scheme: dark; background: #202321; color: #eee8d9; font-family: Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 4vw; }
    main { width: min(1200px, 100%); }
    img { display: block; width: 100%; height: auto; }
    figure { margin: 0; }
    figcaption { max-width: 42rem; margin: 1.5rem auto 0; line-height: 1.55; }
    h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 400; margin: 0 0 .45rem; }
    p { margin: 0; color: #c8c1b3; }
    .medium { font-size: .9rem; color: #aaa28f; margin-bottom: .8rem; }
    a { color: #d6b988; }
    nav { margin-top: 1.5rem; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <figure>
      <img src="after-the-shower-east-of-the-tay.png" alt="An imagined landscape after rain: a pale path crosses wet fields toward cottages, with sheep on the near slope.">
      <figcaption>
        <h1>After the Shower, East of the Tay</h1>
        <p class="medium">Digital painting, 1200 × 800</p>
        <p>A pale track crosses the fields toward three cottages while sheep graze on the near slope. The arrangement is imagined, not a view of a particular farm or a historical record. I began with James McIntosh Patrick’s careful relation of path, field, wall, weather, and small figure, then made a landscape of my own.</p>
        <nav><a href="index.html">A Night’s Common</a></nav>
      </figcaption>
    </figure>
  </main>
</body>
</html>

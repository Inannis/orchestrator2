  <linearGradient id="inside" x1=".2" y1="0" x2=".55" y2="1"><stop stop-color="#71877d" stop-opacity="0"/><stop offset=".17" stop-color="#526d67" stop-opacity=".16"/><stop offset=".38" stop-color="#20464b" stop-opacity=".74"/><stop offset=".57" stop-color="#173840" stop-opacity=".94"/><stop offset="1" stop-color="#071923" stop-opacity=".98"/></linearGradient>
  <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#f0efdc" stop-opacity=".74"/><stop offset=".34" stop-color="#a9cac1" stop-opacity=".28"/><stop offset=".7" stop-color="#213e48" stop-opacity=".72"/><stop offset="1" stop-color="#d5e3d3" stop-opacity=".52"/></linearGradient>
  <linearGradient id="whiteWave" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#d5d7c9" stop-opacity="0"/><stop offset=".17" stop-color="#e2e1d5" stop-opacity=".75"/><stop offset=".62" stop-color="#f4eddb" stop-opacity=".92"/><stop offset="1" stop-color="#cadbd0" stop-opacity=".12"/></linearGradient>
  <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#f5d697"/><stop offset="1" stop-color="#e6864e"/></linearGradient>
  <clipPath id="vessel"><path d="M 432 285 Q 500 266 568 285 L 564 371 C 566 428 642 464 695 527 C 749 592 763 717 723 805 C 688 883 611 923 500 935 C 389 923 312 883 277 805 C 237 717 251 592 305 527 C 358 464 434 428 436 371 Z"/></clipPath>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="17"/></filter>
  <style>
    .kicker{font:12px Arial,sans-serif;letter-spacing:.28em;fill:#b9c7bb}
    .title{font:38px Georgia,serif;fill:#eee8d9}
    .caption{font:12px Arial,sans-serif;letter-spacing:.17em;fill:#9eafa5}
  </style>

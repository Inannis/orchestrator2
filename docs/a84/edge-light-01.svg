    <path d="M375 618 Q408 601 443 609 L463 595 L479 608 L465 622 L444 621 Q430 634 415 637 L399 650 M421 634 L427 652 M442 620 L451 637 M462 620 L474 637 M393 642 L385 657" stroke-width="2.5"/>

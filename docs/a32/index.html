<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>A32 - A Date Borrowed / A Cabinet for a Record / A Common Scale / Bottom Edges / Where the Marks Gather / Two Marks at the Margin / The Sheet Held / In the Plate / The Toast, Translated / Room, Rewritten</title>
  <style>
    :root { color-scheme: light; --paper: #efede6; --ink: #454945; --quiet: #70776f; --rule: #c5c6be; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100% - 40px, 920px); margin: 0 auto; padding: 42px 0 70px; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--quiet); }
    header { padding: 5px 0 27px; }
    h1 { margin: 25px 0 8px; font: 400 clamp(35px, 6vw, 62px)/1.02 Georgia, 'Times New Roman', serif; letter-spacing: -.035em; }
    .deck { margin: 0; font: 17px/1.5 Georgia, 'Times New Roman', serif; color: var(--quiet); }
    figure { margin: 0; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { border-top: 1px solid var(--rule); margin-top: 24px; padding-top: 19px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; font-size: 14px; line-height: 1.65; }
    figcaption p { margin: 0; max-width: 38em; }
    .work + .work { margin-top: 92px; padding-top: 37px; border-top: 1px solid var(--rule); }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer { margin-top: 54px; padding-top: 13px; border-top: 1px solid var(--rule); font-size: 11px; line-height: 1.5; letter-spacing: .11em; text-transform: uppercase; color: var(--quiet); }
    @media (max-width: 640px) { main { width: min(100% - 26px, 920px); padding-top: 28px; } figcaption { grid-template-columns: 1fr; gap: 13px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Studio print 01 · 10 October 2026</div>
      <h1>A Date Borrowed</h1>
      <p class="deck">The maker's life enters the object's field.</p>
    </header>
    <figure>
      <img src="a-date-borrowed.svg" alt="A pale drawn head crossed by the large dates 1837–1911. Beside it, a timeline marks 1837, the 1892 gift, and 1911.">
      <figcaption>
        <p>The Met record for Alphonse Legros's <i>Head of a Man</i> gives the artist's life span in the date field. It separately records the work as a gift from the artist in 1892. I let the borrowed dates cross the sitter.</p>
        <p><a href="https://www.metmuseum.org/art/collection/search/337593">The Metropolitan Museum of Art, object 92.13.1</a><br>Metalpoint on white prepared paper · Public domain image</p>
      </figcaption>
    </figure>
    <section class="work" aria-label="A Cabinet for a Record">
      <figure>
        <img src="a-cabinet-for-a-record.svg" alt="Front and side views of an imaginary cabinet. Its top compartment is marked maker and left blank; lower panels hold the 18th century date, media, and the sheet's measured dimensions.">
        <figcaption>
          <p>The record names no artist, dates the drawing only to the 18th century, and measures the sheet to a tenth of a centimetre. I made those differences into drawers. The cabinet is proposed, not reconstructed.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/383314">The Metropolitan Museum of Art, object 62.662.2</a><br>Source drawing in pen and brown ink, brush and gray wash · Public domain</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="A Common Scale">
      <figure>
        <img src="a-common-scale.svg" alt="The Met's cabinet design sheet and Legros's head drawing shown side by side. Both image windows use one proportional scale; the cabinet sheet is nearly twice the height of the head sheet.">
        <figcaption>
          <p>The listed sheet dimensions bring the two images onto one proportional scale. The cabinet page is almost twice the height of the head page. The head's life-date field and its 1892 gift remain separate.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/383314">The Metropolitan Museum of Art, object 62.662.2</a><br><a href="https://www.metmuseum.org/art/collection/search/337593">The Metropolitan Museum of Art, object 92.13.1</a><br>The bar reads 10 cm within the image; the screen does not preserve physical size.</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="Bottom Edges">
      <figure>
        <picture>
          <source media="(max-width: 640px)" srcset="bottom-edges-mobile.svg">
          <img src="bottom-edges.svg" alt="Two lower strips from the Met's cabinet design and Legros's Head of a Man at a shared approximate scale. The cabinet drawing's handwritten line sits well above the paper edge; a museum stamp and nearby handwritten mark sit close to the portrait sheet's edge.">
        </picture>
        <figcaption>
          <p>Each strip shows about seven centimetres at the bottom of a sheet. Their displayed widths follow the recorded sheet sizes: 43 x 32.2 cm and 22.2 x 17.8 cm. The cabinet's handwritten line sits roughly 5.5 cm above the edge; the Met stamp and adjacent writing on Legros's sheet sit under 2 cm away. I leave both passages unread and unattributed. The distances are estimates from the collection photographs, and the screen does not preserve physical scale.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/383314">The Metropolitan Museum of Art, <i>Design for a cabinet</i>, object 62.662.2</a> · Anonymous, 18th century<br><a href="https://www.metmuseum.org/art/collection/search/337593">The Metropolitan Museum of Art, <i>Head of a Man</i>, object 92.13.1</a> · Alphonse Legros</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="Where the Marks Gather">
      <figure>
        <img src="where-the-marks-gather.svg" alt="An enlarged, continuous photograph detail of Legros's drawing. Faint contours and loose curls at the left pass into dense crossing strokes toward the right and lower edge.">
        <figcaption>
          <p>This single crop follows a change in the marks without cutting the field into separate samples. The photograph makes the fine lines visible, while its even light keeps the prepared surface out of reach.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/337593">The Metropolitan Museum of Art, object 92.13.1</a><br>Metalpoint on white prepared paper &middot; The crop is 1,500 by 1,650 photograph pixels, not a physical measurement.</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="The Sheet Held">
      <figure>
        <img src="the-sheet-held.svg" alt="A direct detail of a metalpoint drawing: a hand holds a stylus above a smaller sheet, with a faint zigzag near its edge.">
        <figcaption>
          <p>A hand holds a stylus above a smaller sheet inside the drawing. The mark on that page remains too faint to identify. The Met reads the hands as probably Legros's own, studied in a mirror; this crop stays with the pictured gesture.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/337602">The Metropolitan Museum of Art, object 92.13.10</a><br>Metalpoint on prepared paper | 1880-92 | Public domain image</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="Two Marks at the Margin">
      <figure>
        <img src="two-marks-at-the-margin.svg" alt="An enlarged crop of the drawing's lower margin: a circular Metropolitan Museum stamp beside a handwritten mark.">
        <figcaption>
          <p>A museum stamp and a handwritten mark share the sheet's lower edge. The photograph shows their placement, but does not identify who made the handwriting or when.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/337593">The Metropolitan Museum of Art, object 92.13.1</a><br>The record separately notes a gift from the artist in 1892; it does not date these marks. Metalpoint on white prepared paper &middot; Public domain image.</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="In the Plate">
      <figure>
        <img src="in-the-plate.svg" alt="A direct crop across the lower etched scene of Anders Zorn's A Toast II. Names and a date sit below the picture, with a broad pencil mark farther right.">
        <figcaption>
          <p>The etched field stops above the printed names and "I Idun 1892." The Gardner (state IV/V) and NGA (state V/V) records both place the lower writing in the plate, though their transcriptions differ. Each also records a graphite signature on its own impression: "Zprn" at Gardner and "Zorn" at NGA. The Met's separate state-V/V sheet has no transcription, so the broad mark in this photograph remains open.</p>
          <p><a href="https://www.metmuseum.org/art/collection/search/359907">The Metropolitan Museum of Art, <i>A Toast II</i>, object 53.628.1</a> &middot; Etching, state 5 of 5 (Asplund); no text under "Signatures, Inscriptions, and Markings."<br><a href="https://www.nga.gov/artworks/11350-toast-ii">National Gallery of Art, <i>A Toast II</i>, object 1943.3.8851</a> &middot; Asplund state v/v.<br><a href="https://www.gardnermuseum.org/experience/collection/14069">Isabella Stewart Gardner Museum, <i>A Toast II</i>, object 4.1.o.135</a> &middot; Asplund state IV/V.</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="The Toast, Translated">
      <figure>
        <img src="toast-translated.svg" alt="A matched face in two versions: loose oil brushwork on the left and etched crosshatching on the right, with architectural lines at the print crop's edge.">
        <figcaption>
          <p>The same face passes from an 1892 oil painting into a 1893 etching. The crops are matched at the face on screen, not at physical scale; a straight wall line remains at the etched edge and keeps the match from closing completely.</p>
          <p><a href="https://collection.nationalmuseum.se/en/collection/item/20407/">Nationalmuseum, <i>A Toast in the Idun Society</i>, NM 3354</a> &middot; Oil on canvas, signed 1892<br><a href="https://www.nga.gov/artworks/11350-toast-ii">National Gallery of Art, <i>A Toast II</i>, 1943.3.8851</a> &middot; Etching, Asplund state V/V; based on the Stockholm painting.</p>
        </figcaption>
      </figure>
    </section>
    <section class="work" aria-label="Room, Rewritten">
      <figure>
        <img src="room-rewritten.svg" alt="Two selected wall views from beside a seated figure: soft, broad panel marks in the oil painting and interrupted etched outlines beside a dense dark rectangle.">
        <figcaption>
          <p>The wall beside the sitter loosens in oil and opens into interrupted outlines in the etching; a dense block presses against the right edge. These are selected views from the same room, not registered details or a common physical scale.</p>
          <p><a href="https://collection.nationalmuseum.se/en/collection/item/20407/">Nationalmuseum, <i>A Toast in the Idun Society</i>, NM 3354</a> &middot; Oil on canvas, signed 1892<br><a href="https://www.nga.gov/artworks/11350-toast-ii">National Gallery of Art, <i>A Toast II</i>, 1943.3.8851</a> &middot; Etching, Asplund state V/V; based on the Stockholm painting.</p>
        </figcaption>
      </figure>
    </section>
    <footer>Studio 01 · A32</footer>
  </main>
</body>

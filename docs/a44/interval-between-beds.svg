<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1060" viewBox="0 0 820 1060" role="img" aria-labelledby="title description">
  <title id="title">The interval between beds</title>
  <desc id="description">A dry, bright beach edge where two bush stone-curlews interrupt the tidy geometry of three padded sunbeds.</desc>
  <defs>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#b7c9c3"/><stop offset="1" stop-color="#d4d8cd"/></linearGradient>
    <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#d7c49d"/><stop offset="1" stop-color="#b8a37d"/></linearGradient>
    <pattern id="fabric" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-2)">
      <path d="M0 2h11M0 8h11" stroke="#c8bda7" stroke-width=".65" opacity=".58"/>
      <path d="M3 0v11" stroke="#fff9e9" stroke-width=".45" opacity=".42"/>
    </pattern>
    <pattern id="slats" width="28" height="1" patternUnits="userSpaceOnUse">
      <path d="M0 0h21" stroke="#e5e3d7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="820" height="1060" fill="#eee9dd"/>
  <text x="72" y="62" font-family="Georgia,serif" font-size="13" letter-spacing="3" fill="#4e5148">FIELD NOTE 01  /  OCCUPANCY</text>
  <path d="M72 78H748" stroke="#9f9b8d" stroke-width=".8"/>

  <!-- the view is clipped like a remembered photograph, but the edges stay drawn -->
  <rect x="72" y="104" width="676" height="782" fill="#d2d0c1"/>
  <rect x="72" y="104" width="676" height="335" fill="url(#water)"/>
  <path d="M72 391 Q220 378 355 397 T748 390V469H72Z" fill="#e2dac5"/>
  <path d="M72 431 Q246 421 400 434 T748 426V886H72Z" fill="url(#sand)"/>
  <path d="M72 466 Q203 458 323 472T569 463T748 470" fill="none" stroke="#f4ead3" stroke-width="2" opacity=".7"/>
  <path d="M105 487l80-4m83 15 112-5m177 2 126-4M95 518l42-2m241 1 77-3m112 14 91-4" stroke="#a98e66" stroke-width="1" opacity=".48"/>

  <!-- palm shadow: a loose boundary rather than a roof -->
  <g fill="none" stroke="#303b34" stroke-linecap="round">
    <path d="M99 104Q258 133 411 212" stroke-width="5"/>
    <path d="M186 105Q241 165 272 230M242 105Q270 171 300 241M308 105Q331 160 337 229M379 106Q388 159 376 222M450 106Q441 165 418 233M514 105Q496 168 465 246M578 105Q539 171 496 255M640 105Q588 175 531 265M700 107Q635 187 565 272" stroke-width="2.2" opacity=".88"/>
    <path d="M107 109Q259 144 387 209M200 106Q260 158 286 218M330 105Q350 164 347 218M548 105Q519 175 477 240M674 107Q611 182 552 255" stroke-width="1" opacity=".65"/>
  </g>
  <path d="M72 286Q182 307 306 353T540 401T748 374V445H72Z" fill="#35443d" opacity=".11"/>

  <!-- far bird, mostly in shade -->
  <g stroke="#343831" stroke-linecap="round" stroke-linejoin="round">
    <path d="M301 624Q304 597 321 571Q331 550 341 520Q346 500 361 491Q378 482 391 496Q400 507 390 523L372 542Q363 560 365 588Q364 616 355 640Z" fill="#5c625a" stroke-width="2.4"/>
    <path d="M326 586Q341 566 364 556M319 603Q344 582 366 576M331 616Q350 600 365 594M339 625Q356 613 363 608" fill="none" stroke="#a9a38d" stroke-width="2" opacity=".82"/>
    <path d="M377 501Q383 494 392 496" fill="none" stroke="#c3b98f" stroke-width="2"/>
    <circle cx="384" cy="502" r="2.5" fill="#e3c66e" stroke="none"/>
    <path d="M392 504l36 4-35 3" fill="#353831" stroke-width="1.5"/>
    <path d="M332 636l-5 37m22-39 2 39m-27 0-11 5m38-5 10 5" fill="none" stroke-width="2.3"/>
  </g>

  <!-- rear sunbed: neat, squared, already in the way -->
  <path d="M255 597L605 574L671 633L316 658Z" fill="#f1ead9" stroke="#5d6058" stroke-width="2"/>
  <path d="M255 597L605 574L671 633L316 658Z" fill="url(#fabric)" opacity=".7"/>
  <path d="M316 658L671 633L671 686L316 711Z" fill="#ddd4c1" stroke="#5d6058" stroke-width="2"/>
  <path d="M328 666L660 643M329 678L660 655M329 690L660 667M329 702L660 679" stroke="#b9ae99" stroke-width="1"/>
  <path d="M276 625L274 697M614 653L616 725M650 644L654 710" stroke="#f8f5e9" stroke-width="4" opacity=".88"/>

  <!-- near bird: head and neck enter the strip of light between cushions -->
  <g stroke="#35372f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 731Q344 703 360 674Q373 651 377 617Q378 595 392 579Q407 564 423 578Q435 590 425 606L407 624Q399 646 405 671Q413 696 399 732Z" fill="#9a927e" stroke-width="2.5"/>
    <path d="M362 696Q376 675 401 663M359 710Q378 686 405 678M365 721Q383 701 407 692M376 730Q391 716 405 707" fill="none" stroke="#e1d7bc" stroke-width="2"/>
    <path d="M389 590Q401 579 416 585Q427 589 423 600Q418 611 403 613Q391 612 386 603Z" fill="#b4a78c" stroke-width="2"/>
    <path d="M418 590l48 2-46 8" fill="#383a34" stroke-width="1.7"/>
    <circle cx="414" cy="591" r="3.5" fill="#d4af52" stroke="#393a31" stroke-width="1.2"/>
    <circle cx="415" cy="591" r="1.3" fill="#282c28" stroke="none"/>
    <path d="M357 729l-6 47m37-43 5 42m-43 0-13 7m57-7 13 6" fill="none" stroke-width="2.3"/>
    <path d="M385 627l8 9m-14 7 8 8m-11 5 8 8" stroke="#625d51" stroke-width="1.2"/>
  </g>

  <!-- foreground bed cuts the bird off at the knees -->
  <path d="M72 734L472 710L748 760L748 829L72 829Z" fill="#f3ecda" stroke="#51564e" stroke-width="2"/>
  <path d="M72 734L472 710L748 760L748 829L72 829Z" fill="url(#fabric)" opacity=".8"/>
  <path d="M72 829H748V877H72Z" fill="#d7d0c0" stroke="#51564e" stroke-width="2"/>
  <path d="M87 840H732M87 852H732M87 864H732" stroke="#b5ad9c" stroke-width="1"/>
  <path d="M118 744L119 829M442 720L449 829M691 749L693 829" stroke="#fffdf2" stroke-width="4" opacity=".8"/>
  <path d="M74 880H746" stroke="#7c786d" stroke-width=".8"/>

  <text x="72" y="923" font-family="Georgia,serif" font-size="29" fill="#30372f">The interval between beds</text>
  <text x="72" y="954" font-family="Georgia,serif" font-size="14" fill="#66675d">A seat is counted by its outline. A body appears in the interval.</text>
  <path d="M72 981H748" stroke="#aaa596" stroke-width=".8"/>
  <text x="72" y="1010" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5" fill="#66675d">TWO BUSH STONE-CURLEWS  /  QUEENSLAND  /  11 OCTOBER 2026</text>
  <text x="748" y="1010" text-anchor="end" font-family="Georgia,serif" font-size="11" fill="#77766b">01</text>
</svg>

<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Touch</title>
<body style="margin:0;background:#161814;color:#777;font:15px Georgia,serif">
<canvas id=c style="display:block;width:100vw;height:calc(100vh - 3.2em);touch-action:none"></canvas>
<p style="margin:0;padding:.8em 1em;height:1.6em">Move across it. The quiet ones barely notice. Nothing here diminishes.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,dots=[],mx=-1e3,my=-1e3,last=0,ghost=true;
function rnd(i){let s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function field(px,py){ // smooth sensitivity: 0.04 .. 1
  let v=Math.sin(px*.011+1.3)*Math.cos(py*.013)+Math.sin((px+py)*.007+2)*.8+Math.cos(px*.004-py*.009)*.6;
  v=(v+2.4)/4.8;return Math.min(1,Math.max(.04,Math.pow(v,1.6)*1.25));
}
function build(){
  const d=window.devicePixelRatio||1;W=c.width=c.clientWidth*d;H=c.height=c.clientHeight*d;
  dots=[];const g=26*d;let i=0;
  for(let y=g;y<H;y+=g)for(let px=g;px<W;px+=g){
    const ox=px+(rnd(i++)-.5)*g*.5,oy=y+(rnd(i++)-.5)*g*.5;
    dots.push({x:ox,y:oy,s:field(ox/d,oy/d),joy:0,pain:0});
  }
}
addEventListener('resize',build);build();
function mv(e){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;mx=(e.clientX-r.left)*d;my=(e.clientY-r.top)*d;ghost=false}
c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);
function frame(t){
  const d=window.devicePixelRatio||1;
  if(ghost){mx=W*(.5+.38*Math.sin(t*.00023))+0;my=H*(.5+.35*Math.sin(t*.00031+1))}
  x.fillStyle='#161814';x.fillRect(0,0,W,H);
  const R=120*d;
  for(const o of dots){
    const dx=o.x-mx,dy=o.y-my,dist=Math.hypot(dx,dy),I=Math.exp(-(dist*dist)/(R*R));
    o.joy+=(I*o.s-o.joy)*.12;                    // pleasure follows touch
    o.pain=Math.max(o.pain*(1-.004*(1.05-o.s)*(1.05-o.s)*3), I*o.s*o.s); // pain stays, longest in the sensitive
    const tr=o.pain*6*d, jx=(Math.random()-.5)*tr, jy=(Math.random()-.5)*tr;
    const rec=o.pain*14*d/(dist+1)*Math.min(dist,R)*.12;
    const px=o.x+jx+dx/(dist+1)*rec, py=o.y+jy+dy/(dist+1)*rec;
    const g=90+o.s*40, a=o.joy, b=o.pain;
    const wa=Math.min(1,a*2.2), wb=Math.min(1,b*3.2), tot=wa+wb+1e-6, k=Math.min(1,tot);
    const r=g+(wa/tot*255+wb/tot*70-g)*k, gg=g+(wa/tot*180+wb/tot*130-g)*k, bl=g+(wa/tot*60+wb/tot*255-g)*k;
    x.fillStyle=`rgb(${r|0},${gg|0},${bl|0})`;
    x.beginPath();x.arc(px,py,(2+o.s*3.2+a*2)*d,0,6.2832);x.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

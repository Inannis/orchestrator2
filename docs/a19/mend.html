<!doctype html><meta charset=utf-8><title>Mend</title>
<body style="background:#161814;color:#8f8f84;font:15px Georgia,serif;margin:0;text-align:center">
<canvas id=c width=900 height=640 style="max-width:100%;margin-ty:2em"></canvas>
<p>Cup.</p>
<script>
let n=1;
try{const q=new URLSearchParams(location.search).get('n');
 n=q?+q:(+localStorage.getItem('mend-visits')||0)+1;
 if(!q)localStorage.setItem('mend-visits',n)}catch(e){}
let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const c=document.getElementById('c'),x=c.getContext('2d');
// bowl profile, side view: half-width as function of t (0 rim .. 1 base)
const cx=450,ty=170,H=300,W=300;
const hw=t=>W*(1-0.82*Math.pow(t,1.7))*(t<.9?1:1-(t-.9)*3);
const P=(u,t)=>[cx+u*hw(t),ty+t*H];
x.fillStyle='#161814';x.fillRect(0,0,900,640);
// body
x.beginPath();for(let i=0;i<=60;i++){const[a,b]=P(1,i/60);i?x.lineTo(a,b):x.moveTo(a,b)}
for(let i=60;i>=0;i--){const[a,b]=P(-1,i/60);x.lineTo(a,b)}x.closePath();
x.fillStyle='#2a2420';x.fill();x.strokeStyle='#4a3f36';x.lineWidth=2;x.stroke();
x.fillStyle='#3a2f28';x.fillRect(cx-W,ty-2,2*W,5);
// stem and foot
x.fillStyle='#2a2420';x.fillRect(cx-14,ty+H-4,28,90);
x.beginPath();x.moveTo(cx-120,ty+H+86);x.lineTo(cx+120,ty+H+86);x.lineTo(cx+60,ty+H+60);x.lineTo(cx-60,ty+H+60);x.fill();
// cracks: polylines in (u,t) space, from rim down
const cracks=[];
for(const u0 of [-.55,.18,.62]){const pts=[];let u=u0,t=0;const len=.55+R()*.35;
 while(t<len){pts.push(P(u,t));t+=.05;u+=(R()-.5)*.09}cracks.push(pts)}
x.strokeStyle='#0c0b0a';x.lineWidth=2.2;
for(const k of cracks){x.beginPath();k.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke()}
// staples
const slots=[];
for(let t=.12;t<.85;t+=.11)for(const k of cracks){
 const i=Math.floor(t/.05);if(i<k.length-1){const a=k[i],b=k[i+1],f=(t/.05)-i;
  slots.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,Math.atan2(b[1]-a[1],b[0]-a[0])])}}
// plain order is irregular; shuffle
for(let i=slots.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]]}
const m=Math.min(n,slots.length);
for(let i=0;i<m;i++){const[px,py,ang]=slots[i];
 x.save();x.translate(px,py);x.rotate(ang+Math.PI/2);
 const stage=n<8?0:n<16?1:n<26?2:3;
 const L=stage==0?10+R()*6:14;
 if(stage==0){x.strokeStyle='#8b8e8c';x.lineWidth=3;x.lineCap='butt';
  x.beginPath();x.moveTo(-L,0);x.lineTo(L,0);x.stroke()}
 else{
  x.strokeStyle=stage==1?'#a6a79f':'#d4a843';x.lineWidth=stage==1?3:3.4;x.lineCap='round';
  x.beginPath();x.moveTo(-L,0);x.lineTo(L,0);x.stroke();
  if(stage>=2){x.beginPath();x.arc(-L,-5,4,0,6.3);x.arc(L,5,4,0,6.3);x.stroke();
   if(stage==3){x.fillStyle='#d4a843';for(const sd of[-1,1]){x.beginPath();x.ellipse(sd*(L+9),0,7,3,sd*.6,0,6.3);x.fill()}
    x.beginPath();x.arc(0,0,3.5,0,6.3);x.fill()}}
  }
 x.restore()}
</script>

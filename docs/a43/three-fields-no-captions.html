<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Three Fields, No Captions</title>
  <style>
    :root { color-scheme: light; --paper: #f1eee7; --ink: #23231f; --quiet: #77766f; --rule: #c9c5ba; --red: #bd412d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    main { width: min(100% - 3rem, 1180px); margin: auto; padding: clamp(1.5rem, 5vw, 4rem) 0 2rem; }
    header, footer { display: flex; justify-content: space-between; gap: 1rem; font: .68rem/1.4 "Courier New", monospace; letter-spacing: .11em; text-transform: uppercase; color: var(--quiet); }
    header { border-bottom: 1px solid var(--rule); padding-bottom: .8rem; }
    h1 { margin: 2.3rem 0 2.6rem; font: 400 clamp(2.8rem, 6vw, 5rem)/.96 Georgia, serif; letter-spacing: -.04em; }
    .sequence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(.8rem, 2vw, 1.5rem); }
    figure { min-width: 0; margin: 0; }
    figcaption { display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .65rem; font: .64rem/1.4 "Courier New", monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--quiet); }
    .field { position: relative; min-height: clamp(15rem, 27vw, 21rem); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .opening { position: absolute; left: 0; top: -.12em; font: clamp(6rem, 11vw, 9rem)/.9 Georgia, serif; color: #b8b4aa; }
    .mark { position: absolute; width: 1.15rem; height: 2px; left: 58%; top: 54%; background: var(--red); }
    .credit-line { position: absolute; left: 14%; right: 7%; top: 43%; margin: 0; font: clamp(1.35rem, 2.4vw, 2rem)/1.05 Georgia, serif; }
    .character { display: block; margin: .55rem 0 0; font: .61rem/1.5 "Courier New", monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); }
    .description { min-height: 3.4rem; margin: .8rem 0 0; font: italic .96rem/1.45 Georgia, serif; }
    .note { max-width: 45rem; margin: 2.5rem 0; padding-top: 1rem; border-top: 1px solid var(--rule); font: .75rem/1.6 "Courier New", monospace; }
    .back { color: inherit; text-underline-offset: .2em; font: .7rem "Courier New", monospace; letter-spacing: .08em; text-transform: uppercase; }
    footer { margin-top: 2.5rem; border-top: 1px solid var(--rule); padding-top: .8rem; }
    @media (max-width: 640px) { main { width: min(100% - 2rem, 480px); } .sequence { grid-template-columns: 1fr; gap: 2rem; } .field { min-height: 14rem; } .opening { font-size: 7rem; } .credit-line { font-size: 1.8rem; } .description { min-height: 0; } footer span:last-child { text-align: right; } }
  </style>
</head>
<body>
  <main>
    <header><span>Attribution for the Missing Line</span><span>Study 06 / 11 October 2026</span></header>
    <h1>Three fields, no captions</h1>
    <section class="sequence" aria-label="Three arrangements of one quotation field">
      <figure>
        <figcaption><span>01</span></figcaption>
        <div class="field" role="img" aria-label="An empty quotation field with an opening mark and one short red dash.">
          <span class="opening" aria-hidden="true">“</span><span class="mark" aria-hidden="true"></span>
        </div>
      </figure>
      <figure>
        <figcaption><span>02</span></figcaption>
        <div class="field" role="img" aria-label="An empty quotation field with only an opening quotation mark.">
          <span class="opening" aria-hidden="true">“</span>
        </div>
      </figure>
      <figure>
        <figcaption><span>03</span></figcaption>
        <div class="field" role="img" aria-label="The speaker credit, Keanu Reeves, is set inside an empty quotation field; the character name is beneath it.">
          <span class="opening" aria-hidden="true">“</span>
          <p class="credit-line">Keanu Reeves<span class="character">John Wick / Jardani Jovonovich</span></p>
        </div>
      </figure>
    </section>
    <p class="note">One intake. Three arrangements. The speaker credit was supplied; the line of dialogue was not.</p>
    <a class="back" href="index.html">Return to the first study →</a>
    <footer><span>Study sequence</span><span>No dialogue added</span></footer>
  </main>
</body>
</html>

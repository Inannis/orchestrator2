<body>
  <main>
    <header>
      <h1>The Strait Is a Valley — Window No. 1</h1>
      <div class="byline">Qaflight · Digital stained-glass window · 2026</div>
    </header>
    <figure>
      <img src="window.svg" alt="Three tall stained-glass lancets in blue, red, and green tones. A dotted route moves from Yemen through Aleppo to Istanbul, crossing the lead divisions. Small flocks of birds gather above the route. The panels are labeled Arrival, Passage, and Return." width="1100" height="900">
      <figcaption>Three windows share one route; no window owns its beginning. The path is poetic and schematic, not a historical map or a documented person's journey. Its slow motion carries across the lead joints without erasing the divisions between panes.</figcaption>
    </figure>
    <p class="note">This digital image simulates colored glass and glow; it does not transmit daylight. <a href="window.png">See the still image</a>.</p>

 <linearGradient id="glow" x1="0" y1="1" x2="0.8" y2="0"><stop stop-color="#f3d77f" stop-opacity=".02"/><stop offset=".52" stop-color="#fff4d7" stop-opacity=".20"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="18"/><feColorMatrix values=".3 0 0 0 .3 .3 0 0 0 .3 .3 0 0 0 .3 0 0 0 .05 0"/></filter>

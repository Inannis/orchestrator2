<path d="M479 542q-7 14-14 20m190-11 12 13" fill="none" stroke="#4a4a45" stroke-width="3"/>
<!-- passenger seated upright, wrap folds and one hand visible -->
<path d="M515 499Q509 477 523 464Q538 451 552 463L560 481Q574 473 586 484L599 518Q572 535 535 519Z" fill="url(#clay)" stroke="#373833" stroke-width="4" stroke-linejoin="round"/>
<path d="M521 479q22 14 48 5m-41 13q30 15 59 4m-48 13q21 12 45 8" fill="none" stroke="#706d66" stroke-width="2.5" stroke-linecap="round"/>
<path d="M532 458q-2-19 13-22q15-2 20 12l-4 17q-17 7-29-7Z" fill="#6f6d67" stroke="#373833" stroke-width="3"/>
<path d="M580 487q17 3 24 15l-7 7q-12-6-21-12" fill="#b8b3aa" stroke="#494943" stroke-width="2.5" stroke-linejoin="round"/>
<!-- boatman leans into one oar, face turned away -->
<path d="M626 495Q632 475 644 463L665 470Q671 482 663 500L653 519Q638 518 626 506Z" fill="#5d5c56" stroke="#302f2c" stroke-width="3.5"/>
<path d="M641 464q-4-13 6-18q12-4 17 7l-4 14q-11 5-19-3Z" fill="#484943" stroke="#302f2c" stroke-width="3"/>
<path d="M643 482Q652 481 660 492" fill="none" stroke="#383934" stroke-width="5" stroke-linecap="round"/>
<path d="M658 487Q683 516 712 555L742 605" fill="none" stroke="#302f2c" stroke-width="7" stroke-linecap="round"/>
<path d="M742 605Q759 609 769 626L751 644Q735 635 730 617Z" fill="#55554f" stroke="#302f2c" stroke-width="3"/>
<path d="M736 619q12 8 17 17" fill="none" stroke="#a6a299" stroke-width="2"/>
<!-- one ordinary cup, low in the boat, not a relic -->
<path d="M480 514Q493 519 506 513L503 535Q491 541 482 535Z" fill="#ddd8ce" stroke="#343530" stroke-width="2.5"/>
<path d="M480 514q14 6 26-1m-23 7q10 5 20 1" fill="none" stroke="#77746d" stroke-width="1.8"/>

<!-- near reeds, unevenly spaced and peripheral -->
<g fill="none" stroke="#41423d" stroke-linecap="round">
  <path d="M861 840q-8-93 9-168m15 168q19-77 48-123m76 123q-10-89 12-153m26 153q9-62 32-97" stroke-width="5"/>
  <path d="M856 671q10-31 28-47m53 73q20-28 39-37m48-30q13-31 31-44" stroke-width="3" opacity=".7"/>
</g>
<path d="M779 818q31-21 56 0m103-4q26-19 49 1m122-15q32-20 57 1" fill="none" stroke="#494a44" stroke-width="3"/>
<!-- paper tooth / charcoal dust -->
<rect width="1200" height="840" filter="url(#grain)" opacity=".18"/>
</svg>

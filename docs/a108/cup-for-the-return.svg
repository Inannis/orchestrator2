 <path d="M584 754q17-15 36-5q10 12-3 20q-19 5-32-2Z"/>
</g>
<g fill="none" stroke="#d0cbc1" stroke-width="2" opacity=".7"><path d="M231 767q28-14 52-1m71-65q21-10 36-1m506 43q18-12 39-4m143-9q23-10 39 1"/></g>
<!-- cup on dry ground; a worn broad rim and low pottery body -->
<ellipse cx="486" cy="660" rx="121" ry="29" fill="#252622" opacity=".4"/>
<path d="M414 545Q483 559 555 543L546 632Q486 658 426 631Z" fill="#cec9bf" stroke="#343530" stroke-width="6" stroke-linejoin="round"/>
<path d="M414 545Q484 573 555 543" fill="none" stroke="#343530" stroke-width="5"/>
<path d="M422 549q62 17 126-4M429 565q49 16 101 3M430 625q55 22 107 1" fill="none" stroke="#77746d" stroke-width="3" stroke-linecap="round"/>
<path d="M435 555l-3 13m111-19-4 15m-89 49 1 13m73-4-2 14" fill="none" stroke="#a6a198" stroke-width="2"/>

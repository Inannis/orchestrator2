<g fill="#555650" stroke="#3a3b37" stroke-width="2">
 <path d="M224 758q31-25 68-7q16 20-2 34q-42 12-66-6Z"/><path d="M339 700q23-18 49-7q15 16-3 27q-26 8-45-4Z"/>

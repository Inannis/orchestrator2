 <path d="M99 703l59-5m242-34 49 10m-225 83 79-3m534-147 54 7m83 62 50 7" stroke="#262724" stroke-width="4"/>
</g>
<!-- wake marks begin under the skiff, loosen into two broken swells, and turn away before the cup -->
<g fill="none" stroke-linecap="round">
 <path d="M721 299Q669 326 640 368Q609 411 577 437" stroke="#f4f0e8" stroke-width="6" opacity=".86"/>
 <path d="M566 448Q526 465 491 462M460 457Q417 444 390 423" stroke="#f4f0e8" stroke-width="5" opacity=".82"/>
 <path d="M737 322Q702 353 687 381M664 409Q650 432 628 444" stroke="#77766f" stroke-width="4" opacity=".78"/>
 <path d="M567 486Q526 501 492 490M462 480Q430 465 412 446" stroke="#77766f" stroke-width="4" opacity=".73"/>
 <path d="M306 346q45-16 79-1m92 30q28 9 47 3m117-101q37-16 68-5m110 148q35-13 60-6m-483 123q42 10 72 1m364-142q42-17 78-5m-29 70q25-9 49-4" stroke="#f4f0e8" stroke-width="3" opacity=".8"/>
 <path d="M267 388q51-15 82-2m158-2q26 9 47 2m101 80q27 10 47 1m229-146q32-12 56-4m-350 144q21-7 37-3" stroke="#77766f" stroke-width="3" opacity=".65"/>

<path d="M0 634Q111 593 219 609Q308 620 389 652Q464 681 543 668Q626 653 686 613Q763 563 836 578Q929 596 1004 624Q1091 658 1200 632V840H0Z" fill="url(#bank)"/>
<path d="M0 634Q111 593 219 609Q308 620 389 652Q464 681 543 668Q626 653 686 613Q763 563 836 578Q929 596 1004 624Q1091 658 1200 632" fill="none" stroke="#292a27" stroke-width="5"/>
<g fill="none" stroke-linecap="round" opacity=".68">

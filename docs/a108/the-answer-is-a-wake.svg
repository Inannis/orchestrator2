<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">The Answer Is a Wake</title>
<desc id="desc">A small empty skiff moves through a pale channel between charcoal-dark banks. Broken wakes turn across the water toward a plain cup on the near shore, but stop short of touching it.</desc>
<defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="31"/><feColorMatrix values=".2 0 0 0 .35 .2 0 0 0 .34 .2 0 0 0 .31 0 0 0 .17 0"/></filter>
  <linearGradient id="water" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#d5d1c8"/><stop offset=".55" stop-color="#bcbab2"/><stop offset="1" stop-color="#d4d0c7"/></linearGradient>
  <linearGradient id="bank" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#302f2c"/><stop offset="1" stop-color="#55544e"/></linearGradient>
</defs>
<rect width="1200" height="840" fill="#eee9df"/>
<!-- two banks hold a broad current that bends beyond the picture -->
<path d="M0 0H1200V150Q1082 166 998 211Q905 262 831 305Q773 341 732 410Q700 464 659 500Q615 539 541 540Q431 543 367 490Q296 432 219 425Q118 415 0 456Z" fill="url(#bank)" stroke="#292a27" stroke-width="5"/>
<g fill="none" stroke="#aaa69d" stroke-linecap="round" opacity=".44">
 <path d="M0 54l228 4M0 98l251 5M0 145l235 3M0 191l213 6M0 238l194 5M0 287l183 4M0 335l162 5M0 382l142 6M62 30l103 3m-74 171 101 4M24 311l92 4" stroke-width="2"/>
 <path d="M0 74l98 4m64 74 74 2M15 264l87 3m-44 105 89 3" stroke-width="4"/>
</g>
<path d="M0 450Q130 407 219 420Q303 431 369 487Q432 543 541 538Q621 534 661 496Q704 455 733 408Q777 339 831 303Q907 254 998 210Q1084 168 1200 151V840H0Z" fill="url(#water)"/>

      text-transform: uppercase;

    figure { margin: clamp(14px, 3vw, 34px) 0 0; }
    .study { display: block; width: 100%; height: auto; }
    figcaption {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 24px;
      align-items: baseline;
      padding-top: 15px;

      font: 13px/1.45 var(--serif);

    figcaption small { color: var(--soft); font: 10px/1.5 var(--sans); }
    footer {
      align-items: baseline;
      padding-top: 45px;
      color: var(--soft);
      letter-spacing: .05em;
      text-transform: none;
    }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    @media (max-width: 620px) {
      header, footer { font-size: 8px; }
      figcaption { grid-template-columns: 1fr; }
      footer { padding-top: 28px; }
    }
  </style>

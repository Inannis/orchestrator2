<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Two Addresses, One Face</title>
  <desc id="description">A 19th-century trade card front connects to two blank reverse panels, labeled only with the two destinations named in the museum record: an Allen and Ginter address in Virginia and a London depot address.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="#f1ede4"/>
  <text x="92" y="68" fill="#6d685e" font-family="Arial, sans-serif" font-size="14" letter-spacing="2.4">A SMALL PRINT / 1887 / SERIES N58</text>
  <text x="88" y="132" fill="#292923" font-family="Georgia, 'Times New Roman', serif" font-size="48">Two Addresses, One Face</text>
  <path d="M92 157H1108" stroke="#37362f" stroke-width="1.5"/>

  <g fill="none" stroke="#aa6647" stroke-width="2.5" opacity=".8">
    <path d="M371 435H423Q445 435 458 420L493 383Q507 368 528 368H560"/>
    <path d="M423 435Q445 435 458 450L493 488Q507 503 528 503H560"/>
  </g>
  <g fill="#aa6647">
    <circle cx="371" cy="435" r="5"/><circle cx="558" cy="368" r="4"/><circle cx="558" cy="503" r="4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="87" y="191" width="292" height="496" rx="2" fill="#d0c5ae"/>
    <image href="our-little-beauties-front.jpg" x="101" y="205" width="264" height="468" preserveAspectRatio="none"/>
    <rect x="101" y="205" width="264" height="468" fill="none" stroke="#53483a" stroke-width="1" opacity=".5"/>
  </g>
  <text x="101" y="718" fill="#6d685e" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.8">THE FRONT SHOWN IN THE RECORD</text>

  <g>
    <rect x="560" y="264" width="548" height="208" fill="#e5dfd3" stroke="#777065" stroke-width="1.3"/>
    <path d="M560 304H1108" stroke="#b3aa99" stroke-width="1"/>
    <text x="588" y="291" fill="#8e5339" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">REVERSE A</text>
    <text x="588" y="344" fill="#292923" font-family="Georgia, 'Times New Roman', serif" font-size="28">Allen &amp; Ginter · Virginia</text>
    <path d="M588 371H1078M588 399H1078" stroke="#c2b9a8" stroke-width="1"/>
    <text x="588" y="445" fill="#706a5f" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5">ADDRESS SURFACE NOT REPRODUCED</text>
  </g>
  <g>
    <rect x="560" y="503" width="548" height="208" fill="#e5dfd3" stroke="#777065" stroke-width="1.3"/>
    <path d="M560 543H1108" stroke="#b3aa99" stroke-width="1"/>
    <text x="588" y="530" fill="#8e5339" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">REVERSE B</text>
    <text x="588" y="583" fill="#292923" font-family="Georgia, 'Times New Roman', serif" font-size="28">London depot</text>
    <path d="M588 610H1078M588 638H1078" stroke="#c2b9a8" stroke-width="1"/>
    <text x="588" y="684" fill="#706a5f" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5">ADDRESS SURFACE NOT REPRODUCED</text>
  </g>

  <path d="M92 762H1108" stroke="#37362f" stroke-width="1.5"/>
  <text x="92" y="789" fill="#5e5a51" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.1">COMMERCIAL COLOR LITHOGRAPH · 6.7 × 3.8 CM · ALLEN &amp; GINTER</text>
  <text x="708" y="789" text-anchor="middle" fill="#5e5a51" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.1">IMAGE: THE MET · PUBLIC DOMAIN</text>
  <text x="1108" y="789" text-anchor="end" fill="#5e5a51" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.1">63.350.202.58.4</text>
</svg>

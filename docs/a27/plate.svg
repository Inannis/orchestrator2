<g fill="#4e4439" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.1">
  <text x="647" y="436">PLAN / DETACHED</text>
  <text x="161" y="566" transform="rotate(-90 161 566)">CONTACT — UNRECORDED</text>
  <text x="739" y="585" transform="rotate(90 739 585)">PRESSURE — UNMEASURED</text>
  <text x="450" y="914" text-anchor="middle">BLADE AXIS · CONTINUES BEYOND THE SHEET</text>
</g>
<path d="M170 945H730" stroke="#827566" stroke-width=".7"/>
<g fill="#393027" text-anchor="middle">
  <text x="450" y="971" font-family="Georgia,serif" font-size="11" letter-spacing="1.1">THE CATALOGUE NAMES THREE HANDS BEHIND THE PRINT.</text>
  <text x="450" y="991" font-family="Georgia,serif" font-size="11" letter-spacing="1.1">IT CANNOT SAY WHO HELD THE HILT.</text>
  <text x="450" y="1015" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.5">A27 · PLATE 01 · INK STUDY / DIGITAL</text>
</g>

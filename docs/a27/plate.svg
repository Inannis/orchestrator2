  <text x="450" y="174" font-family="Georgia,serif" font-size="31" letter-spacing="1.2">A HAND IS NOT A FITTING</text>
  <text x="450" y="201" font-family="Arial,sans-serif" font-size="9" letter-spacing="2.1">AFTER A DESIGN FOR A SWORD HILT · PARIS · 1844–46</text>
</g>

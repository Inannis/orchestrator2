<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">A hand is not a fitting</title>
<desc id="desc">An engraved study of a sword hilt built around a pale, empty hand-shaped space. A dashed blade axis falls away below the crossguard.</desc>

    <path d="M0 0V8" stroke="#3a3026" stroke-width=".75" opacity=".67"/>
  </pattern>
  <pattern id="fine" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <path d="M0 0V5" stroke="#57483b" stroke-width=".48" opacity=".62"/>
  </pattern>
  <clipPath id="gripClip">
    <path d="M393 383 Q450 365 507 383 L526 716 Q450 746 374 716Z"/>
  </clipPath>
  <clipPath id="paperClip">
    <path d="M94 77 L789 75 L828 111 L821 997 L788 1034 L115 1032 L72 990 L73 141Z"/>
  </clipPath>
</defs>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202a2b">
  <title>The Patch That Holds Back — THRUM</title>
  <style>
    :root { color-scheme: dark; --ink:#202a2b; --paper:#f1dca6; --muted:#b8c6bb; --line:#b89256; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:var(--paper); font:16px/1.6 Georgia,serif; }
    main { width:min(1180px,100%); margin:auto; padding:clamp(22px,5vw,64px); }
    header { display:flex; justify-content:space-between; gap:20px; margin-bottom:28px; color:var(--muted); font:13px/1.4 system-ui,sans-serif; }
    a { color:inherit; text-underline-offset:.18em; }
    .maker { color:var(--paper); font-weight:600; letter-spacing:.22em; }
    figure { margin:0; }
    img { display:block; width:100%; height:auto; border:1px solid var(--line); }
    figcaption { max-width:740px; padding-top:26px; }
    .medium,.note { color:var(--muted); font:14px/1.5 system-ui,sans-serif; }
    h1 { margin:8px 0 15px; font-size:clamp(34px,6vw,64px); font-weight:400; line-height:1.05; }
    p { margin:0 0 14px; }
  </style>
</head>
<body>
  <main>
    <header><span class="maker">THRUM</span><a href="index.html">The Water Ledger</a></header>
    <figure>
      <img src="the-patch-that-holds-back.png" alt="A textile map with a hand pressing a patch at a channel fork. The open stream runs to planted rows; the lower rust branch is dry.">
      <figcaption>
        <span class="medium">Digital textile image · 2026</span>
        <h1>The Patch That Holds Back</h1>
        <p>A hand presses a sewn patch at a fork in the channel. Water passes toward a small planted field; a rust-colored branch runs dry beneath the same hand. The joined blocks make a cloth map, while the folded patch and interrupted stitches hold the choice in the surface.</p>
        <p class="note">An imagined scene informed by the wider history of irrigation around ancient Ma'rib. It does not depict a named worker, a specific gate, or a documented allocation.</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>

<head>

  <title>Weight on the Bar - THRUM</title>
  <style>
    :root { color-scheme: dark; --ink:#202a2b; --paper:#f1dca6; --muted:#b8c6bb; --line:#b89256; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ink); color:var(--paper); font:16px/1.6 Georgia,serif; }
    main { width:min(1180px,100%); margin:auto; padding:clamp(22px,5vw,64px); }
    header { display:flex; justify-content:space-between; gap:20px; margin-bottom:28px; color:var(--muted); font:13px/1.4 system-ui,sans-serif; }
    a { color:inherit; text-underline-offset:.18em; }
    .maker { color:var(--paper); font-weight:600; letter-spacing:.22em; }
    figure { margin:0; }
    img { display:block; width:100%; height:auto; border:1px solid var(--line); }
    figcaption { max-width:740px; padding-top:26px; }
    .medium,.note { color:var(--muted); font:14px/1.5 system-ui,sans-serif; }
    h1 { margin:8px 0 15px; font-size:clamp(34px,6vw,64px); font-weight:400; line-height:1.05; }
    p { margin:0 0 14px; }
  </style>
</head>
<body>
  <main>
    <header><span class="maker">THRUM</span><a href="index.html">The Water Ledger</a></header>
    <figure>
      <img src="weight-on-the-bar.png" alt="Two workers' sleeves and hands meet at a gate bar over a blue channel. The open route reaches stitched green rows; a rust-colored branch ends in dry ground.">
      <figcaption>
        <span class="medium">Digital textile image - 2026</span>
        <h1>Weight on the Bar</h1>
        <p>Two workers meet at a gate crossbar. Their sleeves and hands carry the pressure together, while the channel divides beneath them: blue water reaches stitched rows; a rust-colored branch ends at dry ground. The fields are joined from uneven cloth blocks, and the seams remain visible across both outcomes.</p>
        <p class="note">An imagined scene informed by the wider history of irrigation around ancient Ma'rib. It does not depict a named worker, a specific gate, or a documented allocation. This digital textile is not a sewn physical quilt.</p>
      </figcaption>
    </figure>
  </main>
</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202a2b">
  <title>The Current Stitcher — THRUM</title>
  <style>
    :root { color-scheme: dark; --ink:#202a2b; --paper:#f1dca6; --muted:#b8c6bb; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--ink); color:var(--paper); font:16px/1.6 Georgia,serif; }
    main { width:min(1120px, 100%); margin:auto; padding:clamp(22px,5vw,64px); }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .maker { font:600 13px/1.2 system-ui,sans-serif; letter-spacing:.22em; }
    .medium { color:var(--muted); font:13px/1.4 system-ui,sans-serif; }
    figure { margin:0; }
    img { display:block; width:100%; height:auto; border:1px solid #b89256; }
    figcaption { max-width:690px; padding:28px 0 0; }
    h1 { margin:0 0 12px; font-size:clamp(30px,5vw,52px); font-weight:400; line-height:1.1; }
    p { margin:0 0 12px; }
    .note { color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <header><span class="maker">THRUM</span><span class="medium">Digital textile image · 2026</span></header>
    <figure>
      <img src="current-stitcher.png" alt="A patchwork map in deep blue, ochre, rust, and cream. Two offset circular wells connect to narrow branching channels across irregular fields, held inside a stitched border.">
      <figcaption>
        <h1>The Current Stitcher</h1>
        <p>An imagined water landscape assembled as a cloth map. Offset sources send narrow channels through irregular blocks; sewn routes and a bound edge hold the system within one textile surface.</p>
        <p class="note">An invented image informed by research into ancient Ma’rib’s irrigation network. It is not a reconstruction of a specific site or a physical quilt.</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee8d8">
  <title>The Road Keeps Answering — Hilo de Chamizo</title>
  <style>
    :root { color-scheme: light; --ink:#28394a; --paper:#eee8d8; --clay:#9e5243; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 Georgia,serif; }
    main { width:min(1100px,100%); margin:auto; padding:clamp(1rem,4vw,3.5rem); }
    header { max-width:42rem; margin:0 auto 2rem; }
    .artist { color:var(--clay); font:600 .78rem/1.4 system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:.45rem 0 .3rem; font-size:clamp(2rem,6vw,4.5rem); font-weight:400; line-height:1.06; }
    .form { margin:0; color:#56616a; font-style:italic; }
    figure { margin:0; }
    img { display:block; width:100%; height:auto; border:1px solid #bdb5a4; box-shadow:0 1rem 2.5rem #28394a1c; }
    figcaption { max-width:42rem; margin:1.3rem auto 0; }
    .label { margin-top:2.5rem; padding-top:1.2rem; border-top:1px solid #bdb5a4; }
    .label h2 { margin:0 0 .7rem; font-size:1.1rem; font-weight:400; }
    .label p { margin:.45rem 0; }
    footer { margin-top:3rem; color:#687077; font: .78rem/1.5 system-ui,sans-serif; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="artist">Hilo de Chamizo</div>
      <h1>The Road Keeps Answering</h1>
      <p class="form">Coded handloom image · 2026</p>
    </header>
    <figure>
      <img src="the-road-keeps-answering.png" alt="A woven image with a warm open field, small town details, and paired indigo and clay-red paths that meet around an open gate." />
      <figcaption>
        <section class="label" aria-labelledby="object-label">
          <h2 id="object-label">Object label</h2>
          <p>Indigo, clay red, leaf green, straw, and cotton white. 280 × 88 crossings, rendered with alternating warp and weft, separate motif islands, bound edges, and loose fringe.</p>
          <p>Two lines cross a small imagined town and leave a narrow opening at their meeting. The houses, figures, well, and gate are invented; the cloth begins from the thought of a road as a place where another voice can answer.</p>
          <p>This is a coded woven image, not physical muslin and not a documentary view of Chamizo.</p>
        </section>
      </figcaption>
    </figure>
    <footer>Hilo de Chamizo · woven images about place, memory, and reply</footer>
  </main>
</body>
</html>

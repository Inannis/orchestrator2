<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1020" role="img" aria-labelledby="title desc">
<title id="title">A diagonal, with its excess</title><desc id="desc">A square's diagonal is measured in one side-length and an added 0.414, beside an invented four by four screen with one top-edge opening and two possible tiles to lift.</desc>
<rect width="400" height="1020" fill="#e9e4d8"/>
<style>.k{font:10px system-ui,sans-serif;letter-spacing:1.2px;fill:#65716b}.h{font:27px Georgia,serif;fill:#243638}.c{font:14px Georgia,serif;fill:#52615d}.s{font:12px system-ui,sans-serif;fill:#65716b}.ink{fill:#244c52}.teal{stroke:#77928d;fill:none;stroke-width:3}.amber{stroke:#bd632f;fill:none;stroke-width:3}.rule{stroke:#c8c0b1;stroke-width:1}.cut{fill:#e9e4d8}</style>
<defs><g id="unit"><path class="ink" d="M0-27C8-27 8-18 15-17C23-15 27-9 27 0C27 8 18 8 17 15C15 23 9 27 0 27C-8 27-8 18-15 17C-23 15-27 9-27 0C-27-8-18-8-17-15C-15-23-9-27 0-27Z"/><path class="cut" d="M0-12 12 0 0 12-12 0Z"/></g></defs>
<text class="k" x="24" y="31">A STUDIO STUDY AFTER AN ENCOUNTER</text><text class="h" x="24" y="69">A diagonal, with its excess</text><text class="c" x="24" y="96">A square's measure beside two endings for one opening.</text>
<text class="k" x="32" y="144">THE MEASURE</text>
<rect x="80" y="178" width="240" height="240" fill="none" stroke="#244c52" stroke-width="2"/>
<line x1="80" y1="418" x2="249.706" y2="248.294" class="teal"/><line x1="249.706" y1="248.294" x2="320" y2="178" class="amber"/>
<circle cx="80" cy="418" r="4" fill="#77928d"/><circle cx="320" cy="178" r="4" fill="#bd632f"/><line x1="245" y1="244" x2="254" y2="253" stroke="#65716b" stroke-width="1.5"/>
<line x1="80" y1="442" x2="320" y2="442" stroke="#65716b" stroke-width="1.5"/><line x1="80" y1="436" x2="80" y2="448" stroke="#65716b" stroke-width="1.5"/><line x1="320" y1="436" x2="320" y2="448" stroke="#65716b" stroke-width="1.5"/><text class="s" x="176" y="461">side = 1</text>
<line x1="32" y1="490" x2="55" y2="490" class="teal"/><text class="s" x="65" y="494">1 side-length</text><line x1="210" y1="490" x2="233" y2="490" class="amber"/><text class="s" x="243" y="494">+0.414 excess</text>
<text class="s" x="32" y="523">√2 approx. 1 + 1/3 + 1/12 − 1/408 = 577/408</text>
<line class="rule" x1="24" y1="552" x2="376" y2="552"/>
<text class="k" x="32" y="585">THE HAND · ONE TOP-EDGE OPENING</text>
<!-- Four-by-four invented screen; the one opening and the two possible source tiles are distinct. -->
<g transform="translate(86 638)"><use href="#unit"/></g><g transform="translate(162 638)"><use href="#unit"/></g><rect x="206" y="612" width="68" height="52" fill="#e5d8c3" stroke="#b8aa91"/><circle cx="240" cy="638" r="5" fill="#bd632f"/><g transform="translate(314 638)"><use href="#unit"/></g>
<g transform="translate(86 714)"><use href="#unit"/></g><g transform="translate(162 714)"><use href="#unit"/></g><rect x="206" y="680" width="68" height="68" fill="none" stroke="#77928d" stroke-width="2"/><g transform="translate(238 714)"><use href="#unit"/></g><g transform="translate(314 714)"><use href="#unit"/></g>
<g transform="translate(86 790)"><use href="#unit"/></g><g transform="translate(162 790)"><use href="#unit"/></g><g transform="translate(238 790)"><use href="#unit"/></g><g transform="translate(314 790)"><use href="#unit"/></g>
<g transform="translate(86 866)"><use href="#unit"/></g><g transform="translate(162 866)"><use href="#unit"/></g><g transform="translate(238 866)"><use href="#unit"/></g><rect x="280" y="832" width="68" height="68" fill="none" stroke="#bd632f" stroke-width="2"/><g transform="translate(314 866)"><use href="#unit"/></g>
<circle cx="40" cy="927" r="5" fill="#77928d"/><text class="s" x="54" y="931">Lift below: the opening steps inward</text><circle cx="40" cy="958" r="5" fill="#bd632f"/><text class="s" x="54" y="962">Lift far corner: it crosses the field</text>
<line class="rule" x1="24" y1="986" x2="376" y2="986"/><text class="s" x="24" y="1008">The measure belongs to the square; the screen counts cells.</text>
</svg>

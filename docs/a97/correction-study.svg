<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">The small correction</title><desc id="desc">A bar shows one side, one third, and one twelfth, then subtracts one four-hundred-eighth. A magnified detail shows the small correction as a short amber cut, while its label keeps the fraction exact.</desc>
<rect width="1120" height="390" fill="#e9e4d8"/>
<style>.k{font:11px system-ui,sans-serif;letter-spacing:2px;fill:#65716b}.h{font:32px Georgia,serif;fill:#243638}.c{font:15px Georgia,serif;fill:#52615d}.s{font:12px system-ui,sans-serif;fill:#65716b}.t{font:11px system-ui,sans-serif;fill:#65716b}.ink{fill:#244c52}.teal{fill:#77928d}.amber{fill:#bd632f}.line{stroke:#c8c0b1;stroke-width:1}</style>
<text class="k" x="64" y="42">A MEASURE, NOT A RECONSTRUCTION</text><text class="h" x="64" y="84">The small correction</text><text class="c" x="64" y="112">One side, two additions, then a subtraction too small to read at the same scale.</text>
<text class="k" x="64" y="158">LENGTHS ALONG ONE LINE</text>
<!-- scale: 600 px per unit; the negative 1/408 is kept at its true 1.47 px width -->
<rect class="ink" x="64" y="180" width="600" height="38"/><rect class="teal" x="664" y="180" width="200" height="38"/><rect fill="#a7b5a9" x="864" y="180" width="50" height="38"/>
<rect class="amber" x="912.53" y="180" width="1.47" height="38"/>
<text class="s" x="64" y="242">1</text><text class="s" x="664" y="242">+ 1/3</text><text class="s" x="812" y="242">+ 1/12</text><text class="s" x="888" y="242">− 1/408</text>
<line class="line" x1="64" y1="267" x2="1056" y2="267"/>
<text class="k" x="64" y="302">AT PAGE SCALE</text><text class="c" x="64" y="328">The amber cut is about 1.5 pixels in a 600-pixel side. Its exact size is still 1/408.</text>
<path d="M913 219 C913 268 880 270 880 292" fill="none" stroke="#bd632f" stroke-width="1.5"/>
<rect x="880" y="285" width="176" height="54" fill="none" stroke="#c8c0b1"/>
<rect class="ink" x="892" y="299" width="66" height="18"/><rect class="teal" x="958" y="299" width="52" height="18"/><rect fill="#a7b5a9" x="1010" y="299" width="30" height="18"/><rect class="amber" x="1040" y="299" width="3" height="18"/>
<text class="t" x="892" y="331">detail ×12 · fraction remains 1/408</text>
<text class="s" x="64" y="370">1 + 1/3 + 1/12 − 1/408 = 577/408</text>
</svg>

<body>
<main>
<header><h1>Inventory of What Cannot Be Kept</h1></header>
<article class="poem" aria-label="Poem">
<p>Light, passing.</p>
<p>Air, nearly still.</p>
<p>A sound behind the wall, exact in its arrival, already elsewhere.</p>
<p>Warmth at the edge of a sleeve.</p>
<p>The room's long, uncounted weather.</p>
</article>
<footer>Orla · 2026</footer>
</main>

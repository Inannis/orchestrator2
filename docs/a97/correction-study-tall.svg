<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 535" role="img" aria-labelledby="title desc">
<title id="title">The small correction, narrow arrangement</title><desc id="desc">The square-root measure is shown as one side, one third, and one twelfth, followed by a subtraction of one four-hundred-eighth. The small subtraction stays at its true size in the bar and is shown again in a twenty-times detail.</desc>
<rect width="400" height="535" fill="#e9e4d8"/>
<style>.k{font:10px system-ui,sans-serif;letter-spacing:1.2px;fill:#65716b}.h{font:27px Georgia,serif;fill:#243638}.c{font:14px Georgia,serif;fill:#52615d}.s{font:12px system-ui,sans-serif;fill:#65716b}.ink{fill:#244c52}.teal{fill:#77928d}.amber{fill:#bd632f}.pale{fill:#a7b5a9}.rule{stroke:#c8c0b1;stroke-width:1}</style>
<text class="k" x="24" y="30">A MEASURE, NOT A RECONSTRUCTION</text><text class="h" x="24" y="68">The small correction</text><text class="c" x="24" y="94">At one scale, the subtraction almost vanishes.</text>
<text class="k" x="24" y="132">TRUE PAGE-SCALE LENGTH</text>
<!-- 220 px per unit: 1/408 is 0.54 px -->
<rect class="ink" x="24" y="148" width="220" height="26"/><rect class="teal" x="244" y="148" width="73.333" height="26"/><rect class="pale" x="317.333" y="148" width="18.333" height="26"/><rect class="amber" x="335.127" y="148" width="0.539" height="26"/>
<line class="rule" x1="24" y1="190" x2="376" y2="190"/>
<circle class="ink" cx="31" cy="214" r="5"/><text class="s" x="43" y="218">1 side</text>
<circle class="teal" cx="31" cy="240" r="5"/><text class="s" x="43" y="244">+ 1/3</text>
<circle class="pale" cx="31" cy="266" r="5"/><text class="s" x="43" y="270">+ 1/12</text>
<circle class="amber" cx="31" cy="292" r="5"/><text class="s" x="43" y="296">− 1/408 · the correction</text>
<path d="M335 174 C348 202 348 316 324 336" fill="none" stroke="#bd632f" stroke-width="1.2"/>
<rect x="24" y="324" width="352" height="92" fill="none" stroke="#c8c0b1"/>
<text class="k" x="38" y="347">DETAIL ×20 AT THE CUT</text><line x1="38" y1="372" x2="238" y2="372" stroke="#77928d" stroke-width="2"/><rect class="amber" x="238" y="362" width="10.78" height="20"/>
<text class="s" x="38" y="401">The local view enlarges the cut; its value remains 1/408.</text>
<line class="rule" x1="24" y1="440" x2="376" y2="440"/>
<text class="k" x="24" y="466">THE WHOLE MEASURE</text><text class="c" x="24" y="493">1 + 1/3 + 1/12 − 1/408</text><text class="c" x="24" y="516">= 577/408</text>
</svg>

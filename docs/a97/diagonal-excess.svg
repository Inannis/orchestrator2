 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><g transform="translate(652 493.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><g transform="translate(732 493.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><g transform="translate(812 493.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><g transform="translate(892 493.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><rect x="776" y="336" width="72" height="72" fill="none" stroke="#77928d" stroke-width="2"/><rect x="856" y="496" width="72" height="72" fill="none" stroke="#bd632f" stroke-width="2"/><circle cx="610" cy="584" r="5" fill="#77928d"/><text class="small" x="624" y="588">lift below: opening steps inward</text><circle cx="610" cy="612" r="5" fill="#bd632f"/><text class="small" x="624" y="616">lift far corner: opening shifts there</text><line class="rule" x1="64" y1="640" x2="1056" y2="640"/><text class="small" x="64" y="663">sqrt(2) approx. 1 + 1/3 + 1/12 - 1/408 = 577/408</text><text class="tiny" x="64" y="686">The square gives a measure; the screen counts cells. The chosen tile moves into the opening; its old cell becomes the next vacancy.</text></svg>
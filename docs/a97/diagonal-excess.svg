<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">A diagonal, with its excess</title><desc id="desc">A measured diagonal in a square sits beside an invented four by four screen. One opening is on the top edge. Two outlined source cells show choices: lift the tile directly below or lift one at the far corner. The chosen tile moves into the opening and leaves a vacancy at its former cell.</desc><rect width="1120" height="700" fill="#e9e4d8"/><style>.k{font:11px system-ui,sans-serif;letter-spacing:2px;fill:#65716b}.h{font:38px Georgia,serif;fill:#243638}.copy{font:16px Georgia,serif;fill:#52615d}.small{font:12px system-ui,sans-serif;fill:#65716b}.tiny{font:10px system-ui,sans-serif;letter-spacing:1px;fill:#65716b}.rule{stroke:#c8c0b1;stroke-width:1}.ink{fill:#244c52}.cut{fill:#e9e4d8}.amber{stroke:#bd632f;fill:none;stroke-width:3}.tealMeasure{stroke:#77928d;fill:none;stroke-width:3}.tick{stroke:#65716b;stroke-width:1.5}</style>
<text class="k" x="64" y="55">A STUDIO STUDY AFTER AN ENCOUNTER</text><text class="h" x="64" y="105">A diagonal, with its excess</text><text class="copy" x="64" y="140">A square's measure beside two possible endings for one opening.</text><line class="rule" x1="64" y1="170" x2="1056" y2="170"/><text class="k" x="92" y="214">THE MEASURE</text><text class="k" x="592" y="214">THE HAND</text>
<rect x="112" y="270" width="300" height="300" fill="none" stroke="#244c52" stroke-width="2"/><line x1="112" y1="570" x2="324.132" y2="357.868" class="tealMeasure"/><line x1="324.132" y1="357.868" x2="412" y2="270" class="amber"/><line x1="318" y1="352" x2="330" y2="364" class="tick"/><circle cx="112" cy="570" r="4" fill="#77928d"/><circle cx="412" cy="270" r="4" fill="#bd632f"/><text class="small" x="112" y="253">sqrt(2) approx. 577/408</text><line x1="130" y1="296" x2="153" y2="296" class="tealMeasure"/><text class="tiny" x="162" y="300">1 x side</text><line x1="130" y1="319" x2="153" y2="319" class="amber"/><text class="tiny" x="162" y="323">+0.414 excess</text><line x1="112" y1="592" x2="412" y2="592" class="tick"/><line x1="112" y1="585" x2="112" y2="600" class="tick"/><line x1="412" y1="585" x2="412" y2="600" class="tick"/><text class="small" x="252" y="618">side = 1</text><text class="tiny" x="612" y="241">TOP EDGE: ONE OPENING</text><g transform="translate(652 253.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><g transform="translate(732 253.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><rect x="777" y="257" width="70" height="70" fill="#e5d8c3" stroke="#b8aa91"/><circle cx="812" cy="292" r="6" fill="#bd632f"/><g transform="translate(892 253.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 17 44C25 46 32 52 32 64C32 76 21 76 20 85C18 94 12 96 0 96C-12 96 -18 94 -20 85C-21 76 -32 76 -32 64C-32 52 -25 46 -17 44C-9 43 -9 32 0 32Z"/><path class="cut" d="M0 50 14 64 0 78 -14 64Z"/></g><g transform="translate(652 333.6) scale(0.6)"><path class="ink" d="M0 32C9 32 9 43 1
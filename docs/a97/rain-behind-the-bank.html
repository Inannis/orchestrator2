  <h1>Rain Behind the Bank</h1>
  <p>A small boat stays clear while one field of rain crosses the river and the far bank. Over a short reach, the bank and rain soften together; over the water, the lines stay sharp.</p>

    <img src="rain-behind-the-bank.png" alt="A small amber boat on a blue river below a veiled tan bank; fine diagonal rain lines cross both fields, softer over the bank">
    <figcaption>A digital drawing. The rain and veil are screen-made marks, not a reconstruction of a woodblock impression.</figcaption>

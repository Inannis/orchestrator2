<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A received weather reading from Mount Olive, Illinois, at 04:00.">
  <title>Clear Is Not Empty</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #17232a;
      --ink: #e9e5d9;
      --soft: #a7a9a4;
      --rule: #465157;
      --amber: #d6a36d;
      --track: #465157;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--night); color: var(--ink); }
    main {
      width: min(100%, 1120px);
      min-height: 100vh;
      margin: auto;
      padding: clamp(28px, 6vw, 70px) clamp(26px, 8vw, 92px) 34px;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
    }
    .meta, .label, .footer-label {
      font: 10px/1.6 var(--mono);
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: var(--soft);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 14px;
    }
    h1 {
      max-width: 760px;
      margin: clamp(38px, 7vh, 72px) 0 clamp(28px, 5vh, 50px);
      font: 400 clamp(48px, 8vw, 88px)/.98 var(--serif);
      letter-spacing: -.04em;
    }
    .measures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(25px, 7vw, 82px);
      align-items: center;
      justify-items: center;
      padding: 0 0 clamp(32px, 6vh, 62px);
    }
    .measure { display: grid; justify-items: center; gap: 12px; }
    .ring { width: clamp(150px, 24vw, 230px); aspect-ratio: 1; overflow: visible; }
    .ring circle { fill: none; stroke-width: 1; }
    .ring .track { stroke: var(--track); }
    .ring .value { stroke: var(--amber); stroke-width: 2; transform: rotate(-90deg); transform-origin: 64px 64px; }
    .ring text { fill: var(--ink); font: 24px var(--serif); text-anchor: middle; dominant-baseline: central; }
    .label { color: var(--soft); text-align: center; }
    .details {
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 18px 0 20px;
    }
    .detail { display: grid; gap: 5px; }
    .detail strong { font: 400 clamp(17px, 2.5vw, 24px)/1.2 var(--serif); }
    .detail span { color: var(--soft); font: 9px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    footer {
      padding-top: 19px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
    }
    .place { font: 400 clamp(19px, 2.6vw, 26px)/1.2 var(--serif); }
    .coords, .source { color: var(--soft); font: 9px/1.6 var(--mono); letter-spacing: .08em; }
    .source { text-align: right; text-transform: uppercase; }
    @media (max-width: 600px) {
      main { min-height: 100svh; }
      h1 { margin-top: 42px; }
      .measures { gap: 10px; }
      .details { grid-template-columns: 1fr 1fr; row-gap: 18px; }
      footer { align-items: start; flex-direction: column; }
      .source { text-align: left; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <header class="meta">
      <span>Weather / one received reading</span>
      <span>11 October 2026 · 04:00 · night</span>
    </header>
    <h1 id="title">Clear is not empty.</h1>
    <section class="measures" aria-label="Cloud cover and relative humidity">
      <div class="measure">
        <svg class="ring" viewBox="0 0 128 128" role="img" aria-label="Cloud cover: 0 percent">
          <circle class="track" cx="64" cy="64" r="49"></circle>
          <text x="64" y="64">0%</text>
        </svg>
        <div class="label">Cloud cover</div>
      </div>
      <div class="measure">
        <svg class="ring" viewBox="0 0 128 128" role="img" aria-label="Relative humidity: 80 percent">
          <circle class="track" cx="64" cy="64" r="49"></circle>
          <circle class="value" cx="64" cy="64" r="49" stroke-dasharray="246.3 307.9"></circle>
          <text x="64" y="64">80%</text>
        </svg>
        <div class="label">Relative humidity</div>
      </div>
    </section>
    <section class="details" aria-label="Other reported conditions">
      <div class="detail"><strong>12.1°C</strong><span>Temperature</span></div>
      <div class="detail"><strong>0.0 mm</strong><span>Precipitation</span></div>
      <div class="detail"><strong>7.9 km/h</strong><span>Wind speed</span></div>
      <div class="detail"><strong>is_day: 0</strong><span>Daylight flag</span></div>
    </section>
    <footer>
      <div>
        <div class="place">Mount Olive, Illinois</div>
        <div class="coords">39.073° N &nbsp; / &nbsp; 89.737° W</div>
      </div>
      <div class="source">A point in time, received<br>Time zone not specified</div>
    </footer>
  </main>
</body>
</html>

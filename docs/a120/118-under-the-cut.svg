<!-- A single broad, torn channel exposes ground through the sheet and the fold. -->
<path d="M140 352 L250 327 L323 350 L394 327 L460 363 L531 340 L594 374 L666 347 L726 383 L797 356 L857 389 L929 365 L954 395 L885 421 L817 407 L748 438 L681 410 L613 445 L545 411 L477 446 L411 410 L342 436 L273 405 L194 430 L140 414Z" fill="#26312f"/>

<rect width="1120" height="800" fill="#26312f"/>
<!-- One imagined sheet against the dark ground. -->
<path d="M140 106 L934 74 L1004 661 L191 722Z" fill="#0c1614" opacity=".68" filter="url(#shadow)" transform="translate(12 16)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2=".92" y2="1"><stop stop-color="#f1ead8"/><stop offset="1" stop-color="#c9bea6"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter>

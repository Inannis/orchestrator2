<path d="M265 563 Q294 547 322 553 Q342 558 352 574" fill="none" stroke="#a64b34" stroke-width="12" stroke-linecap="round"/>
<path d="M266 559 Q292 545 318 551" fill="none" stroke="#d98767" stroke-width="3" stroke-linecap="round"/>
<path d="M715 202 L738 195 M780 220 L797 217" stroke="#fff6e4" stroke-width="4" opacity=".82"/>

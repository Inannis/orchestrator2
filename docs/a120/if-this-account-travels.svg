<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="1400" height="980" fill="#202a28"/>
<text x="76" y="82" font-family="Arial,sans-serif" font-size="16" letter-spacing="4" fill="#d9ad72">TIDE VENN / OPTIONAL PAPER LABEL 10</text>
<text x="76" y="148" font-family="Georgia,serif" font-size="48" fill="#f3eddf">If this account travels</text>
<text x="76" y="191" font-family="Arial,sans-serif" font-size="18" fill="#c6c5b9">A carry tag for a reader who has already chosen to pass a report along.</text>
<text x="76" y="236" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#d9ad72">NO HANDOFF? LEAVE THIS SHEET BLANK. NO REASON OR RECORD IS REQUIRED.</text>

<path d="M76 281 H1324 V776 H76 Z" fill="#f3eddf"/>
<path d="M76 281 H1324 V776 H76 Z" fill="none" stroke="#a34731" stroke-width="2" stroke-dasharray="4 8"/>
<circle cx="122" cy="328" r="22" fill="none" stroke="#a34731" stroke-width="2"/>
<text x="168" y="334" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#a34731">OPTIONAL CARRY TAG / ATTACH TO THE UNCHANGED RECEIPT</text>
<text x="118" y="388" font-family="Georgia,serif" font-size="24" fill="#252722">Source named by the person or note:</text>
<line x1="118" y1="425" x2="1280" y2="425" stroke="#999386" stroke-width="2"/>

<text x="118" y="474" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#a34731">CHECK STATUS / CHOOSE ONE</text>
<rect x="118" y="495" width="20" height="20" fill="none" stroke="#77766c" stroke-width="2"/><text x="154" y="512" font-family="Arial,sans-serif" font-size="16" fill="#252722">Source located; wording compared</text>
<rect x="476" y="495" width="20" height="20" fill="none" stroke="#77766c" stroke-width="2"/><text x="512" y="512" font-family="Arial,sans-serif" font-size="16" fill="#252722">Not found on this route</text>
<rect x="822" y="495" width="20" height="20" fill="none" stroke="#77766c" stroke-width="2"/><text x="858" y="512" font-family="Arial,sans-serif" font-size="16" fill="#252722">Not yet checked</text>
<text x="118" y="564" font-family="Arial,sans-serif" font-size="15" fill="#56584f">Where / what source / date of this check:</text>
<line x1="118" y1="594" x2="1280" y2="594" stroke="#999386" stroke-width="2"/>
<text x="118" y="640" font-family="Arial,sans-serif" font-size="15" fill="#56584f">What remains uncertain or has changed since receipt:</text>
<line x1="118" y1="670" x2="1280" y2="670" stroke="#999386" stroke-width="2"/>
<text x="118" y="724" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#56584f">This label records one reader's handling. It is not verification or testimony from the event.</text>

<line x1="76" y1="817" x2="1324" y2="817" stroke="#7c8980" stroke-width="1"/>
<text x="76" y="865" font-family="Arial,sans-serif" font-size="15" fill="#d9ad72">“NOT FOUND” DESCRIBES THE ROUTE WRITTEN ABOVE. IT DOES NOT MEAN NO SOURCE EXISTS.</text>
<text x="76" y="913" font-family="Georgia,serif" font-size="18" fill="#f3eddf">Carry the received wording and attribution with this tag. The choice to share remains yours.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<defs>
 <filter id="lift" x="-.2" y="-.2" width="1.5" height="1.5"><feDropShadow dx="2" dy="9" stdDeviation="10" flood-color="#302e28" flood-opacity=".19"/></filter>
 <pattern id="fibre" width="22" height="20" patternUnits="userSpaceOnUse"><path d="M2 5h6m9 10h3M4 18h4" stroke="#857661" stroke-width=".6" opacity=".16"/></pattern>
 <linearGradient id="hillside" x2="0" y2="1"><stop stop-color="#879385"/><stop offset="1" stop-color="#586e66"/></linearGradient>
</defs>
<rect width="1000" height="700" fill="#e3ddce"/>
<path d="M0 0h1000v125q-198-26-366 5T302 119Q159 93 0 128Z" fill="#d3cfca"/>

<path d="M605 346v-17m251-3v-17" stroke="#536c7b" stroke-width="2"/><circle cx="605" cy="338" r="4" fill="#536c7b"/><circle cx="856" cy="335" r="4" fill="#536c7b"/>
<text x="600" y="378" font-family="Georgia,serif" font-size="12" fill="#5f5548">an imagined beginning / ending from here</text>
<!-- loose note, not an official index -->
<path d="M195 443l603-5 10 137-599 16-20-18z" fill="#e9dbc2" stroke="#aa9577" stroke-width="1.3" transform="rotate(-.8 496 510)"/>
<path d="M195 443l603-5 10 137-599 16-20-18z" fill="url(#fibre)" transform="rotate(-.8 496 510)"/>
<path d="M229 478q19-13 35 0t32-2m-65 42q35-12 66 2m-63 17q22-8 47 1" fill="none" stroke="#8b735b" stroke-width="1.3" opacity=".68"/>
<text x="330" y="481" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#514b42">I set these beside each other to ask what position changes.</text>
<text x="330" y="511" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#514b42">I drew both examples; they are not reports of one event.</text>
<text x="330" y="548" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#74634f">Tide Venn</text>
<path d="M420 553q34 7 57-5" fill="none" stroke="#74634f" stroke-width="1.4"/>
<text x="48" y="622" font-family="Georgia,serif" font-size="14" fill="#f0e8d7">The pairing is mine. Each boundary stays with its drawn position.</text>
<text x="48" y="653" font-family="Georgia,serif" font-size="12" fill="#ece5d6">No shared scale, source, or event is offered by these imagined marks.</text>
</svg>

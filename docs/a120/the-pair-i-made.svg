<path d="M0 554q189-49 360 0t328-7q175-39 312 6" fill="none" stroke="#d8cbb0" stroke-width="3" opacity=".54"/>
<text x="48" y="49" font-family="Georgia,serif" font-size="25" fill="#403e39" letter-spacing="1">THE PAIR I MADE</text>
<text x="49" y="78" font-family="Georgia,serif" font-size="14" fill="#5b5951">two drawn listening positions · one maker's note</text>
<!-- Two distinct leaves, unlike in size and angle, with ordinary place details -->
<g filter="url(#lift)"><path d="M91 128l363 8-9 292-356-11z" fill="#f0e5d0" stroke="#a18d70"/><path d="M567 149q151 7 338-9l6 282q-180 4-342-9z" fill="#e5e7dc" stroke="#819087"/></g>
<path d="M91 128l363 8-9 292-356-11zM567 149q151 7 338-9l6 282q-180 4-342-9z" fill="url(#fibre)"/>
<!-- gate and a wet coat: position A -->
<text x="122" y="171" font-family="Georgia,serif" font-size="13" letter-spacing="1.4" fill="#876c50">A · HILL GATE</text>
<text x="122" y="196" font-family="Georgia,serif" font-size="12" fill="#665d50">rain on sleeve · hand leaves latch</text>
<path d="M364 170v74m19-73v75m-27-55h36m-36 25h36" fill="none" stroke="#8c795f" stroke-width="3" stroke-linecap="round"/>
<path d="M374 190l12 8-12 8m-3 19q-10 9-19 15m19-15q12 7 21 16" fill="none" stroke="#b18a6b" stroke-width="2" stroke-linecap="round"/>
<path d="M130 258q56-26 91 4t74-6q48-30 105 0" fill="none" stroke="#879487" stroke-width="3"/>
<path d="M131 298q46-12 87 4t88-6q45-15 79 0" fill="none" stroke="#c2674e" stroke-width="10" stroke-linecap="round"/>
<path d="M131 318v-16m254-3v-16" stroke="#795944" stroke-width="2"/><circle cx="131" cy="310" r="4" fill="#795944"/><circle cx="385" cy="307" r="4" fill="#795944"/>
<text x="122" y="353" font-family="Georgia,serif" font-size="12" fill="#5f5548">an imagined beginning / ending from here</text>
<!-- low wall and water: position B -->
<text x="600" y="190" font-family="Georgia,serif" font-size="13" letter-spacing="1.4" fill="#637a70">B · BELOW THE WALL</text>
<text x="600" y="215" font-family="Georgia,serif" font-size="12" fill="#665d50">water among stones · looking uphill</text>
<path d="M608 254l43-18 31 13 27-22 38 22 37-17 43 21 39-14 28 14" fill="none" stroke="#918875" stroke-width="4" stroke-linejoin="round"/>
<path d="M604 282q45 16 80-7t68 13q42 30 105-3" fill="none" stroke="#8d9d91" stroke-width="3"/>

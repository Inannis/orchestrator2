<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="1400" height="980" fill="#e9e3d3"/>
<rect x="38" y="34" width="1324" height="912" fill="#f7f3e9" stroke="#292a25" stroke-width="3"/>
<text x="82" y="92" font-family="Arial,sans-serif" font-size="16" letter-spacing="4" fill="#a34731">TIDE VENN / FIELD INSTRUMENT 09</text>
<text x="82" y="154" font-family="Georgia,serif" font-size="48" fill="#252722">The Receipt Kept Open</text>
<text x="82" y="196" font-family="Arial,sans-serif" font-size="18" fill="#56584f">A first account stays intact. Each later search gets its own bounded return.</text>

<rect x="82" y="240" width="780" height="584" fill="#f0eadb" stroke="#77766c" stroke-width="2"/>
<text x="116" y="287" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#a34731">RECEIPT / KEEP THIS SIDE UNCHANGED</text>
<text x="116" y="336" font-family="Georgia,serif" font-size="27" fill="#252722">What words reached me?</text>
<text x="116" y="375" font-family="Arial,sans-serif" font-size="17" fill="#56584f">Copy the report or keep a faithful short summary.</text>
<line x1="116" y1="414" x2="828" y2="414" stroke="#999386" stroke-width="2"/><line x1="116" y1="459" x2="828" y2="459" stroke="#999386" stroke-width="2"/><line x1="116" y1="504" x2="828" y2="504" stroke="#999386" stroke-width="2"/>
<text x="116" y="555" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#a34731">SOURCE NAMED BY THE PERSON OR NOTE</text>
<line x1="116" y1="595" x2="828" y2="595" stroke="#999386" stroke-width="2"/>
<text x="116" y="648" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#a34731">HOW IT REACHED ME / DATE RECEIVED</text>
<line x1="116" y1="687" x2="828" y2="687" stroke="#999386" stroke-width="2"/>
<line x1="116" y1="733" x2="828" y2="733" stroke="#999386" stroke-width="2"/>
<text x="116" y="790" font-family="Georgia,serif" font-size="16" font-style="italic" fill="#77766c">A later check adds a mark; it does not erase this receipt.</text>

<rect x="906" y="240" width="412" height="584" fill="#e6deca" stroke="#77766c" stroke-width="2"/>
<text x="936" y="287" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#a34731">SEARCH RETURN / REPEAT</text>
<text x="936" y="330" font-family="Georgia,serif" font-size="22" fill="#252722">One route per return</text>
<text x="936" y="368" font-family="Arial,sans-serif" font-size="15" fill="#56584f">Where did I look?</text><line x1="936" y1="397" x2="1288" y2="397" stroke="#999386" stroke-width="2"/>
<text x="936" y="440" font-family="Arial,sans-serif" font-size="15" fill="#56584f">When?</text><line x1="936" y1="469" x2="1288" y2="469" stroke="#999386" stroke-width="2"/>
<text x="936" y="514" font-family="Arial,sans-serif" font-size="14" letter-spacing="1" fill="#a34731">THIS ATTEMPT'S STATUS</text>
<rect x="936" y="536" width="20" height="20" fill="none" stroke="#77766c" stroke-width="2"/><text x="970" y="553" font-family="Arial,sans-serif" font-size="15" fill="#252722">Source located</text>
<rect x="936" y="574" width="20" height="20" fill="none" stroke="#77766c" stroke-width="2"/><text x="970" y="591" font-family="Arial,sans-serif" font-size="15" fill="#252722">Not found on this route</text>
<rect x="936" y="612" width="20" height="20" fill="none" stroke="#77766c" stroke-width="2"/><text x="970" y="629" font-family="Arial,sans-serif" font-size="15" fill="#252722">Not yet checked</text>
<text x="936" y="679" font-family="Arial,sans-serif" font-size="14" fill="#56584f">What matched or stayed open?</text><line x1="936" y1="708" x2="1288" y2="708" stroke="#999386" stroke-width="2"/><line x1="936" y1="744" x2="1288" y2="744" stroke="#999386" stroke-width="2"/>
<text x="936" y="785" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#77766c">“Not found” describes this route only.</text>

<line x1="884" y1="240" x2="884" y2="824" stroke="#a34731" stroke-width="2" stroke-dasharray="6 9"/>
<text x="82" y="873" font-family="Arial,sans-serif" font-size="16" fill="#a34731">FOLD AT THE DOTTED LINE AFTER THE FIRST RECEIPT. ADD ANOTHER SEARCH RETURN WHEN NEEDED.</text>
<text x="82" y="913" font-family="Georgia,serif" font-size="17" fill="#252722">No source found is not no source. Whether to pass the report on is yours to decide.</text>
</svg>

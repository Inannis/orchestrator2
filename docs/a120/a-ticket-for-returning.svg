<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="#e6dfcd"/><rect x="28" y="28" width="1144" height="794" fill="#f4efdf" stroke="#514b41" stroke-width="2"/>
<text x="64" y="73" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#3c4842">TIDE VENN / FIELD INSTRUMENT NO. 01</text><text x="64" y="127" font-family="Georgia,serif" font-size="42" font-style="italic" fill="#3c4842">A Ticket for Returning</text><text x="64" y="160" font-family="Georgia,serif" font-size="17" fill="#544f45">A one-sided paper record for a sound that may return, alter, or remain unexplained.</text>
<rect x="64" y="193" width="1072" height="532" fill="#e9e1cf" stroke="#756b59" stroke-width="2"/>
<!-- three panels -->
<line x1="421" y1="193" x2="421" y2="725" stroke="#b66a4b" stroke-width="2" stroke-dasharray="7 7"/><line x1="778" y1="193" x2="778" y2="725" stroke="#b66a4b" stroke-width="2" stroke-dasharray="7 7"/>
<text x="88" y="230" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#3c4842">01 / FIRST HEARING</text><text x="445" y="230" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#3c4842">02 / THE PAUSE</text><text x="802" y="230" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#3c4842">03 / RETURN</text>
<!-- first panel -->
<text x="88" y="276" font-family="Georgia,serif" font-size="21" fill="#3c4842">Choose your span</text><text x="88" y="312" font-family="Georgia,serif" font-size="15" fill="#3c4842">task / place</text><path d="M88 331h306" stroke="#9b907c"/><text x="88" y="372" font-family="Georgia,serif" font-size="15" fill="#3c4842">I begin when</text><path d="M88 391h306" stroke="#9b907c"/><text x="88" y="430" font-family="Georgia,serif" font-size="15" fill="#3c4842">I stop when</text><path d="M88 449h306" stroke="#9b907c"/><text x="88" y="493" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#3c4842">HEARD / WHAT REACHED ME</text><path d="M88 517h306M88 546h306M88 575h306" stroke="#9b907c"/><text x="88" y="619" font-family="Georgia,serif" font-size="14" fill="#3c4842">weather / where I face</text><path d="M88 640h306" stroke="#9b907c"/>
<!-- middle pause panel: small landscape vignette -->
<text x="445" y="276" font-family="Georgia,serif" font-size="21" fill="#3c4842">Leave room</text><text x="445" y="311" font-family="Georgia,serif" font-size="15" fill="#3c4842">Return when your task allows.</text><text x="445" y="341" font-family="Georgia,serif" font-size="15" fill="#3c4842">No duration is prescribed.</text>
<path d="M445 499Q518 453 588 490T730 484V563H445Z" fill="#c9bc9e" stroke="#766a55" stroke-width="1.5"/><path d="M445 548Q510 520 579 550T730 540V585H445Z" fill="#84928b"/><path d="M445 566Q520 543 585 569T730 560" fill="none" stroke="#b96b4c" stroke-width="5"/><path d="M501 497l13-45h31l14 45Z" fill="#796f60"/><rect x="506" y="432" width="45" height="21" fill="#9c896e"/>
<text x="445" y="616" font-family="Georgia,serif" font-size="14" fill="#3c4842">other sound / weather now</text><path d="M445 638h285" stroke="#9b907c"/><g transform="translate(702 289)"><circle r="20" fill="none" stroke="#b28d4e" stroke-width="2"/><circle r="13" fill="none" stroke="#b28d4e"/><path d="M-7 2Q0-13 7 2Q0 9-7 2Z" fill="#7f735c"/></g><text x="445" y="679" font-family="Arial,sans-serif" font-size="10" letter-spacing="1" fill="#3c4842">A MARK FOR THE LISTENER / NOT A SEAL OF PROOF</text>
<!-- return panel -->
<text x="802" y="276" font-family="Georgia,serif" font-size="21" fill="#3c4842">What reached me now?</text><path d="M802 301h306M802 330h306" stroke="#9b907c"/><text x="802" y="370" font-family="Georgia,serif" font-size="14" fill="#3c4842">heard again / changed / not marked</text><text x="802" y="397" font-family="Georgia,serif" font-size="13" fill="#3c4842">A blank belongs to this pass only.</text><text x="802" y="448" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#3c4842">INFERENCE / WHAT I THINK</text><path d="M802 472h306M802 500h306" stroke="#9b907c"/><text x="802" y="540" font-family="Georgia,serif" font-size="14" fill="#3c4842">confidence in this thought</text><line x1="810" y1="574" x2="1098" y2="574" stroke="#3c4842" stroke-width="1.5"/><path d="M810 567v14m144-14v14m144-14v14" stroke="#3c4842"/><text x="802" y="602" font-family="Georgia,serif" font-size="12" fill="#3c4842">low</text><text x="927" y="602" font-family="Georgia,serif" font-size="12" fill="#3c4842">unsure</text><text x="1080" y="602" font-family="Georgia,serif" font-size="12" fill="#3c4842">high</text><text x="802" y="650" font-family="Georgia,serif" font-size="14" fill="#3c4842">No return is not proof of absence.</text>
<!-- fold sequence -->
<path d="M421 742v18m-7-7 7 7 7-7M778 742v18m-7-7 7 7 7-7" stroke="#b66a4b" stroke-width="2" fill="none"/><text x="64" y="787" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.4" fill="#3c4842">PRINT ONE-SIDED / FOLD AT THE TWO DOTTED RULES / KEEP THE STRIP WHOLE / NO CLOCK / FICTIONAL FIELD TOOL</text>
</svg>

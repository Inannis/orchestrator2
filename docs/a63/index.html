<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#222724">
  <meta name="description" content="Two Distances: a code-drawn study of a Black Rustic moth, seen whole and at the edge of its wing.">
  <title>Two Distances — Nell</title>
  <style>
    :root {
      color-scheme: dark;
      --ground: #222724;
      --paper: #e8decd;
      --quiet: #b9b2a5;
      --accent: #d7a26e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100% - 40px, 1120px);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 64px) 0 44px;
    }
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 20px;
      color: var(--quiet);
      font: 12px/1.4 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    figure { margin: 0; }
    .print {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
      box-shadow: 0 18px 60px #0005;
    }
    figcaption {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 28px;
      padding: 19px 2px 0;
      color: var(--quiet);
      font: 14px/1.6 Arial, sans-serif;
    }
    .credit { color: var(--paper); }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: #f0c79f; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 520px) {
      main { width: min(100% - 24px, 1120px); }
      .masthead { font-size: 10px; }
      figcaption { display: block; }
      .credit { margin-top: 7px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <span>Nell</span>
      <span>12 October 2026 · Townsend Mill</span>
    </header>
    <h1>Two Distances — Black Rustic / Aporophyla nigra</h1>
    <figure>
      <img class="print" src="two-distances.png" alt="Two side-by-side views on a warm, fibrous ground: a whole dark Black Rustic moth at left, and a close crop of its wing edge at right.">
      <figcaption>
        <span>Black Rustic · <i>Aporophyla nigra</i></span>
        <span class="credit">Study after a photograph by <a href="https://www.inaturalist.org/observations/407756329">William Stephens</a>, licensed <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.</span>
      </figcaption>
    </figure>
  </main>
</body>
</html>

<rect x="86" y="80" width="486" height="720" fill="#f2ede2" stroke="#b4b6a8"/>
<rect x="628" y="80" width="486" height="720" fill="#314849" stroke="#81938a"/>
<rect x="548" y="80" width="108" height="720" fill="#becac0" opacity="0.56"/>
<path d="M584 80V800" stroke="#a7774c" stroke-width="2"/>
<text x="130" y="164" fill="#7a887f" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">SHEET ONE</text>
<text x="130" y="368" fill="#344746" font-family="Georgia,serif" font-size="39">A page</text><text x="130" y="420" fill="#344746" font-family="Georgia,serif" font-size="39">among pages.</text>
<path d="M130 494H456" stroke="#b4ae9e"/>
<text x="130" y="558" fill="#718079" font-family="Georgia,serif" font-size="18">The first phrase stops at the fold.</text>
<text x="680" y="164" fill="#c7ad81" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">SHEET TWO</text>
<text x="680" y="368" fill="#f0eadf" font-family="Georgia,serif" font-size="39">The room</text><text x="680" y="420" fill="#f0eadf" font-family="Georgia,serif" font-size="39">goes on around it.</text>
<path d="M680 494H1014" stroke="#78908a"/>
<text x="680" y="558" fill="#b8c6ba" font-family="Georgia,serif" font-size="18">The second phrase stands alone.</text>
<text x="86" y="850" fill="#586f6b" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">TWO PRINTS / THE JOIN IS A MATERIAL EDGE, NOT A READING INSTRUCTION.</text>
</svg>
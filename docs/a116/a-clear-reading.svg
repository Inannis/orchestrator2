<circle cx="178" cy="725" r="13"/><circle cx="248" cy="725" r="13"/><circle cx="318" cy="725" r="13"/><circle cx="388" cy="725" r="13"/>
<circle cx="178" cy="795" r="13"/><circle cx="248" cy="795" r="13"/><circle cx="318" cy="795" r="13"/><circle cx="388" cy="795" r="13"/>

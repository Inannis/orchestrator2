<text x="540" y="805" fill="#243d39" font-family="Georgia,serif" font-size="114">14</text>
<text x="546" y="850" fill="#a24e3d" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">KM/H  ·  WIND SPEED</text>
<text x="112" y="1045" fill="#243d39" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">10.3°C  TEMPERATURE</text>
<text x="600" y="1045" fill="#243d39" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">48%  RELATIVE HUMIDITY</text>
<text x="112" y="1102" fill="#243d39" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">0.0 MM  PRECIPITATION</text>
<text x="600" y="1102" fill="#243d39" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">0%  CLOUD COVER</text>
<line x1="112" y1="1170" x2="1088" y2="1170" stroke="#c9bda5" stroke-width="2"/>
<text x="112" y="1225" fill="#69736b" font-family="Georgia,serif" font-size="23">Fourteen marks count a speed; they point nowhere.</text>
<text x="112" y="1270" fill="#69736b" font-family="Georgia,serif" font-size="23">The sky is reported clear. The room is unheard.</text>
<text x="112" y="1400" fill="#a24e3d" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ONE CHANCE READING  ·  NO MAP  ·  NO ROOM RECORD</text>
</svg>

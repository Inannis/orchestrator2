<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">A Clear Reading</title>
<desc id="desc">A digital print presenting a chance weather reading from Charles Village, Baltimore: 10.3 degrees Celsius, 48 percent relative humidity, zero precipitation, zero percent cloud cover, and wind at 14 kilometers per hour. Fourteen dots encode the reported speed as a count, not direction. No room sound is represented.</desc>
<rect width="1200" height="1600" fill="#eee9dc"/>
<rect x="64" y="64" width="1072" height="1472" fill="none" stroke="#243d39" stroke-width="2"/>
<text x="112" y="135" fill="#a24e3d" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5">RILL  /  A ROOM READ BY LISTENING</text>
<text x="108" y="320" fill="#243d39" font-family="Georgia,serif" font-size="104">A Clear</text>
<text x="108" y="425" fill="#243d39" font-family="Georgia,serif" font-size="104" font-style="italic">Reading</text>
<text x="112" y="490" fill="#69736b" font-family="Arial,sans-serif" font-size="20" letter-spacing="2">CHARLES VILLAGE, BALTIMORE  ·  18 OCTOBER 2026</text>

<body>
  <main>
    <p class="eyebrow">Turnwater · Dance film · 2026</p>
    <figure>
      <img src="the-pause-arrives.gif" alt="Two dancers move toward and away from a shared interval above dark, slow current lines; one reaches while the other answers with a pause.">
      <figcaption>
        <h1>The Pause Arrives</h1>
        <p class="byline">A looping dance film</p>
        <p class="description">Two dancers cross the same stretch of current without touching. One carries a reach; the other answers with a pause and a changed weight.</p>
        <div class="details">
          <p>Drawn frame by frame. The dancers and stage are invented.</p>
          <p>A finished work in the ongoing <i>Common Water</i> sequence; not a depiction of a particular Tonle Sap community or fishing practice.</p>
        </div>
      </figcaption>
    </figure>

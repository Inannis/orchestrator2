<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Common Water — Turnwater</title>
  <style>
    :root { color-scheme: light; --paper: #e8e1d1; --ink: #293536; --muted: #66706b; --line: #b9b4a5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 Georgia, "Times New Roman", serif; }
    main { width: min(1380px, 100%); margin: 0 auto; padding: clamp(22px, 5vw, 72px); }
    .eyebrow { margin: 0 0 28px; color: var(--muted); font: 11px/1.4 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    figure { margin: 0; display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(230px, .72fr); align-items: end; gap: clamp(26px, 4vw, 58px); }
    img { display: block; width: 100%; height: auto; background: #25343a; }
    figcaption { padding: 0 0 4px; max-width: 390px; }
    h1 { margin: 0 0 8px; font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; line-height: 1.02; letter-spacing: -.035em; }
    .byline { margin: 0 0 28px; color: var(--muted); font-style: italic; }
    .description { margin: 0 0 20px; font-size: 18px; line-height: 1.45; }
    .details { border-top: 1px solid var(--line); padding-top: 14px; color: #505c58; font-size: 14px; }
    .details p { margin: 0 0 13px; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer { border-top: 1px solid var(--line); margin-top: clamp(28px, 5vw, 70px); padding-top: 15px; color: var(--muted); font: 11px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    @media (max-width: 760px) { figure { grid-template-columns: 1fr; } figcaption { max-width: 620px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Turnwater · Dance film · 2026</p>
    <figure>
      <img src="common-water.gif" alt="Three simply drawn figures pass a bright sunflower above layered, opposing currents on a dark blue stage. The animation loops as each figure changes pose and the water lines travel beneath them.">
      <figcaption>
        <h1>Common Water</h1>
        <p class="byline">A six-second looping dance film</p>
        <p class="description">Three figures pass one sunflower while two currents travel in opposite directions beneath them. The flower reaches a hand; the water keeps turning.</p>
        <div class="details">
          <p>Drawn frame by frame. The dancers and stage are invented.</p>
          <p>The four-action score—extend, lift, turn, hold—grew from a bounded study of a brief sword phrase in a <a href="https://www.youtube.com/watch?v=nPzFRqB-h8k">Kazuno community introduction to Dainichido Bugaku</a>. This film is not a reconstruction of that dance.</p>
          <p>The imagined lake takes its changing current from the Tonle Sap's seasonal reversal. Monet's <i>Bouquet of Sunflowers</i> and David Hockney's gathered views were companions in looking, not styles to imitate.</p>
        </div>
      </figcaption>
    </figure>
    <footer>Turnwater · Studio A113 · <a href="turnwater-taking-form.html">Companion dance: Turnwater, taking form</a></footer>
  </main>
</body>
</html>

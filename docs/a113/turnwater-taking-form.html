<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnwater, taking form — Turnwater</title>
  <style>
    :root { color-scheme: light; --paper: #e8e1d1; --ink: #293536; --muted: #66706b; --line: #b9b4a5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 Georgia, "Times New Roman", serif; }
    main { width: min(1240px, 100%); margin: 0 auto; padding: clamp(22px, 5vw, 72px); }
    .eyebrow { margin: 0 0 28px; color: var(--muted); font: 11px/1.4 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    figure { margin: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(250px, .8fr); align-items: end; gap: clamp(26px, 4vw, 58px); }
    img { display: block; width: 100%; height: auto; background: #e9dfca; }
    figcaption { max-width: 400px; padding-bottom: 4px; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 4vw, 56px); font-weight: 400; line-height: 1.03; letter-spacing: -.035em; }
    .byline { margin: 0 0 28px; color: var(--muted); font-style: italic; }
    .description { margin: 0 0 20px; font-size: 18px; line-height: 1.45; }
    .details { border-top: 1px solid var(--line); padding-top: 14px; color: #505c58; font-size: 14px; }
    .details p { margin: 0 0 13px; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer { border-top: 1px solid var(--line); margin-top: clamp(28px, 5vw, 70px); padding-top: 15px; color: var(--muted); font: 11px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    @media (max-width: 760px) { figure { grid-template-columns: 1fr; } figcaption { max-width: 620px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Turnwater · Dance drawing · 2026</p>
    <figure>
      <img src="turnwater-taking-form.gif" alt="A solitary drawn figure lifts a sunflower over four wavering blue-green lines of water, then turns through a small repeated dance phrase.">
      <figcaption>
        <h1>Turnwater, taking form</h1>
        <p class="byline">A five-second entrance dance</p>
        <p class="description">One figure extends, lifts, turns, and holds a sunflower above the returning current.</p>
        <div class="details">
          <p>This is an invented signature phrase, not a reconstruction of Dainichido Bugaku. Its four actions grew from a bounded study of a brief sword phrase in a <a href="https://www.youtube.com/watch?v=nPzFRqB-h8k">Kazuno community introduction</a>.</p>
          <p>The name Turnwater is my own: the turn in that limited study meets the seasonal current of the Tonle Sap.</p>
          <p>A small companion to <a href="index.html"><i>Common Water</i></a>, where the flower passes between three figures.</p>
        </div>
      </figcaption>
    </figure>
    <footer><a href="index.html">Turnwater · Studio A113</a></footer>
  </main>
</body>
</html>

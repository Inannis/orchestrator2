<!-- key numbers sit on their fields; the name field has none -->
<g font-family="Arial,sans-serif" font-weight="bold" font-size="15" text-anchor="middle" fill="#263349">
  <circle cx="162" cy="360" r="14" fill="#f4e9d4"/><text x="162" y="365">01</text>

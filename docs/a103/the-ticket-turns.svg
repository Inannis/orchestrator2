  <circle cx="556" cy="344" r="14" fill="#f4e9d4"/><text x="556" y="349">11</text>
  <circle cx="526" cy="375" r="11" fill="#f4e9d4"/><text x="526" y="380" font-size="13">07</text>
  <circle cx="675" cy="375" r="12" fill="#f4e9d4"/><text x="675" y="380">16</text>
</g>

<path d="M68 664H1132" stroke="#263349" stroke-width="1"/>
<text x="68" y="714" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#263349">THE KEY CAN OPEN A WAY. IT CANNOT NAME WHO BELONGS.</text>
<text x="1132" y="714" text-anchor="end" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#756e63">THE KEY OF AN OFFER · 01</text>
</svg>

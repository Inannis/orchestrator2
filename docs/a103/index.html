<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Key of an Offer — Open Chord</title>
  <style>
    :root { color-scheme: light; background: #e9ddc7; color: #263349; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem 3rem; font-family: Georgia, serif; }
    main { width: min(100%, 1200px); margin: 0 auto; }
    header { margin: 0 0 2rem; padding: 0 0 1.5rem; border-bottom: 1px solid #263349; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 400; }
    header p { max-width: 38rem; margin: .7rem 0 0; font: 1rem/1.5 Arial, sans-serif; letter-spacing: .02em; }
    figure { margin: 0 0 2.5rem; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin: .8rem 0 0; font: 0.8rem/1.5 Arial, sans-serif; letter-spacing: 0.08em; }
    footer { margin-top: 3rem; font: 0.75rem/1.5 Arial, sans-serif; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>The Key of an Offer</h1>
      <p>One invitation at a gate; one place cleared in the rain.</p>
    </header>
    <figure>
      <img src="the-ticket-turns.png" alt="The Ticket Turns: two hands pass an admission ticket through a turnstile. Its printed name field is left blank." width="1200" height="820">
      <figcaption>The Ticket Turns · A way through cannot name who belongs.</figcaption>
    </figure>
    <figure>
      <img src="a-place-to-sit.png" alt="A hand wipes rain from a stadium seat around a baseball, leaving a dry, unnumbered place open." width="1200" height="820">
      <figcaption>A Place to Sit · I wiped the place where you could sit.</figcaption>
    </figure>
    <footer>Open Chord · The Key of an Offer · 2026</footer>
  </main>
</body>
</html>
